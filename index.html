<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DTEL · Sistema de Gestão da Qualidade</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F1F4F0;
    --surface:#FFFFFF;
    --ink:#1F2A22;
    --muted:#5E6E63;
    --primary:#1A9E38;
    --primary-dark:#0C5C24;
    --primary-light:#E4F5E7;
    --accent:#C99A00;
    --accent-light:#FFF3CC;
    --danger:#A6433D;
    --danger-light:#F3E0DE;
    --blue:#3E6B8C;
    --blue-light:#E3ECF2;
    --line:#E1E6DD;
    --chip-dark:#0F2A1C;
    --sidebar:#FFFFFF;
    --sidebar-ink:#0C5C24;
    --sidebar-muted:#6B8577;
    --radius:12px;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
    --sans: 'Segoe UI', ui-sans-serif, system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14.5px; line-height:1.45; }
  h1,h2,h3,h4{font-family:var(--serif); font-weight:600; margin:0 0 4px 0; color:var(--primary-dark);}
  a{color:var(--primary);}
  button{font-family:var(--sans); cursor:pointer;}
  ::selection{background:var(--accent-light);}

  #loginScreen{ min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 15% 20%, rgba(47,111,98,0.10), transparent 40%), radial-gradient(circle at 85% 80%, rgba(184,134,59,0.12), transparent 40%), var(--bg); }
  .login-card{ width:380px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:36px 34px 60px; box-shadow:0 20px 45px -25px rgba(20,40,35,0.35); position:relative; }
  .login-selo-center{ display:flex; justify-content:center; margin-bottom:14px; }
  .login-selo-center img{ width:100px; height:auto; }
  .login-logo-corner{ position:absolute; bottom:18px; right:20px; width:88px; }
  .login-logo-corner img{ width:100%; height:auto; display:block; }
  .login-card h1{font-size:22px;}
  .login-card p.sub{color:var(--muted); margin:0 0 22px 0; font-size:13px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
  .field select, .field input, .field textarea{ width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:#FCFBF8; font-size:14px; color:var(--ink); font-family:var(--sans); }
  .field select:focus, .field input:focus, .field textarea:focus{outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary);}
  .field textarea{resize:vertical; min-height:70px;}
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--primary); color:#fff; border:none; padding:9px 16px; border-radius:8px; font-size:13.5px; font-weight:600; transition:background .15s; }
  .btn:hover{background:var(--primary-dark);}
  .btn.block{width:100%;}
  .btn.ghost{background:transparent; color:var(--primary); border:1px solid var(--primary);}
  .btn.ghost:hover{background:var(--primary-light);}
  .btn.danger{background:var(--danger);}
  .btn.danger:hover{background:#7e332e;}
  .btn.small{padding:5px 10px; font-size:12px; border-radius:6px;}
  .login-hint{margin-top:16px; font-size:11.5px; color:var(--muted); background:var(--primary-light); padding:10px 12px; border-radius:8px;}
  .login-error{color:var(--danger); font-size:12.5px; margin-top:10px; min-height:16px;}

  #app{display:none; min-height:100vh; grid-template-columns:230px 1fr; grid-template-rows:64px 1fr;}
  #app.active{display:grid;}
  #topbar{ grid-column:1/3; background:var(--surface); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 20px; height:64px; position:relative; z-index:20; }
  #topbar .brand{display:flex; align-items:center; gap:10px;}
  #topbar .brand-stack{display:flex; flex-direction:row; align-items:center; justify-content:flex-start; gap:12px;}
  #topbar .brand .mark{height:34px; display:flex; align-items:center;}
  #topbar .brand .mark img{height:100%; width:auto;}
  #topbar .brand-text{font-family:var(--serif); font-weight:700; font-size:13.5px; color:#111; letter-spacing:.01em; line-height:1.25; text-align:left;}
  #topbar .who{display:flex; align-items:center; gap:14px; font-size:13px; color:var(--muted);}
  #topbar .who b{color:var(--ink);}
  .bell-wrap{position:relative;}
  .bell-btn{background:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:15px; position:relative;}
  .bell-dot{position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff; font-size:10px; font-weight:700; border-radius:20px; padding:1px 5px; min-width:16px; text-align:center;}
  .notif-panel{ position:absolute; top:40px; right:0; width:340px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:0 20px 40px -20px rgba(0,0,0,.35); padding:10px; max-height:420px; overflow-y:auto; display:none; }
  .notif-panel.open{display:block;}
  .notif-item{padding:9px 10px; border-radius:8px; font-size:12.5px; margin-bottom:4px; border-left:3px solid var(--accent); background:#FBF7EF;}
  .notif-item.bad{border-left-color:var(--danger); background:var(--danger-light);}
  .notif-empty{padding:20px; text-align:center; color:var(--muted); font-size:12.5px;}

  #sidebar{ background:var(--sidebar); color:var(--sidebar-ink); padding:16px 10px; overflow-y:auto; display:flex; flex-direction:column; border-right:1px solid var(--line); }
  #sidebarMenu{flex:1;}
  .sidebar-footer{display:flex; align-items:center; justify-content:center; padding:14px 10px 10px; border-top:1px solid var(--line); margin-top:10px;}
  .sidebar-footer img{width:56px; height:auto; flex-shrink:0;}
  .nav-group{margin-bottom:6px;}
  .nav-title{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; font-weight:800; color:var(--sidebar-ink); padding:14px 10px 6px;}
  .nav-title-toggle{display:flex; justify-content:space-between; align-items:center; cursor:pointer; border-radius:6px; user-select:none;}
  .nav-title-toggle:hover{background:rgba(12,92,36,0.06);}
  .nav-chevron{font-size:9px; opacity:.75;}
  .nav-items{overflow:hidden;}
  .nav-items.hidden{display:none;}
  .nav-item{ display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:7px; font-size:13.5px; color:var(--sidebar-ink); cursor:pointer; margin-bottom:2px; border:1px solid transparent; }
  .nav-item:hover{background:rgba(12,92,36,0.07);}
  .nav-item.active{background:var(--primary); color:#fff; font-weight:600;}
  .nav-icon{width:16px; text-align:center; opacity:.85; font-size:13px;}
  #main{padding:22px 28px; overflow-y:auto;}
  .page-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:10px;}
  .page-head p{color:var(--muted); margin:2px 0 0; font-size:13px;}
  .crumb{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--accent); font-weight:700; margin-bottom:2px;}
  .head-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:18px;}
  .card h3{font-size:15px; margin-bottom:12px;}
  .grid{display:grid; gap:14px;}
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-7{grid-template-columns:repeat(7,1fr);}
  @media(max-width:1200px){.grid.cols-7{grid-template-columns:repeat(4,1fr);}}
  @media(max-width:1000px){.grid.cols-4{grid-template-columns:1fr 1fr;} .grid.cols-3{grid-template-columns:1fr 1fr;} #app{grid-template-columns:1fr;}}

  /* ---------- Responsivo (celular/tablet) ---------- */
  .hamburger-btn{ display:none; background:none; border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:16px; color:var(--primary-dark); }
  #sidebarBackdrop{ display:none; }
  .card{ overflow-x:auto; }
  @media(max-width:900px){
    #app{ position:relative; }
    #topbar{ position:sticky; top:0; z-index:25; }
    .hamburger-btn{ display:inline-flex; }
    #sidebar{
      position:fixed; top:64px; left:0; bottom:0; width:265px; max-width:82vw;
      transform:translateX(-100%); transition:transform .22s ease; z-index:30;
      box-shadow:12px 0 28px rgba(0,0,0,.18);
    }
    #sidebar.open{ transform:translateX(0); }
    #sidebarBackdrop{
      display:block; position:fixed; top:64px; left:0; right:0; bottom:0; background:rgba(10,20,15,.35);
      opacity:0; pointer-events:none; transition:opacity .22s ease; z-index:28;
    }
    #sidebarBackdrop.open{ opacity:1; pointer-events:auto; }
    #main{ padding:16px 14px; }
    .brand-text{ display:none; }
  }
  @media(max-width:600px){
    .grid.cols-7, .grid.cols-4{ grid-template-columns:1fr 1fr; }
    .grid.cols-3, .grid.cols-2{ grid-template-columns:1fr; }
    .page-head{ flex-direction:column; align-items:flex-start; }
    .who-perfil{ display:none; }
    .notif-panel{ width:min(320px,85vw); }
    .login-card{ width:90vw; padding:30px 20px 58px; }
    .login-logo-corner{ width:70px; bottom:14px; right:14px; }
    dialog{ width:94vw; }
    #main{ padding:12px 10px; }
    table{ font-size:12.5px; }
  }

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); border-bottom:1.5px solid var(--line); padding:8px 8px;}
  td{padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top;}
  tr:hover td{background:#FBFAF7;}
  .table-actions{display:flex; gap:6px; flex-wrap:wrap;}
  .empty-state{text-align:center; padding:36px 10px; color:var(--muted);}
  .empty-state .glyph{font-size:26px; margin-bottom:8px;}

  .stamp{ display:inline-block; font-family:var(--serif); font-weight:700; font-size:11px; letter-spacing:.05em; text-transform:uppercase; padding:3px 10px; border-radius:3px; border:1.5px solid currentColor; transform:rotate(-2deg); white-space:nowrap; }
  .stamp.ok{color:var(--primary); background:var(--primary-light);}
  .stamp.warn{color:var(--accent); background:var(--accent-light);}
  .stamp.bad{color:var(--danger); background:var(--danger-light);}
  .stamp.neutral{color:var(--muted); background:#EFEDE6;}

  /* ---------- KPI cards (estilo dashboard) ---------- */
  .kpi{background:var(--surface); border:1px solid var(--line); border-left:3px solid transparent; border-radius:var(--radius); padding:16px 17px 15px; position:relative; transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;}
  .kpi:hover{transform:translateY(-2px); box-shadow:0 10px 24px -14px rgba(20,40,25,.28);}
  .kpi .kpi-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;}
  .kpi .lbl{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; font-weight:700; max-width:135px; line-height:1.35;}
  .kpi .icon-circle{width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0;}
  .icon-green{background:var(--primary-light); color:var(--primary);}
  .icon-red{background:var(--danger-light); color:var(--danger);}
  .icon-amber{background:var(--accent-light); color:var(--accent);}
  .icon-blue{background:var(--blue-light); color:var(--blue);}
  .kpi.color-green{border-left-color:var(--primary);}
  .kpi.color-red{border-left-color:var(--danger);}
  .kpi.color-amber{border-left-color:var(--accent);}
  .kpi.color-blue{border-left-color:var(--blue);}
  .kpi .num{font-family:var(--serif); font-size:26px; font-weight:700; color:var(--ink); letter-spacing:-.01em;}
  .kpi .sub{font-size:10.5px; color:var(--muted); margin-top:4px;}
  .kpi.alert{border-left-color:var(--danger);}
  .kpi.alert .num{color:var(--danger);}
  .section-title{display:flex; align-items:center; gap:8px; font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--primary-dark); font-weight:800; margin:26px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line);}
  .section-title .sec-icon{font-size:15px;}

  /* ---------- Produção do período ---------- */
  .prod-table td, .prod-table th{text-align:right;}
  .prod-table td:first-child, .prod-table th:first-child{text-align:left;}
  .variacao.pos{color:var(--primary); font-weight:700;}
  .variacao.neg{color:var(--danger); font-weight:700;}
  .variacao.zero{color:var(--muted);}

  .valor-gerado{background:linear-gradient(135deg, var(--primary-light) 0%, #EFF7F1 100%); border:1px solid #D5EBDA; border-radius:var(--radius); padding:22px 24px; margin-bottom:18px;}
  .valor-gerado h3{color:var(--primary-dark); margin-bottom:14px;}
  .valor-gerado .row{display:flex; gap:36px; flex-wrap:wrap;}
  .valor-gerado .item .num{font-family:var(--serif); font-size:27px; font-weight:700; color:var(--primary-dark);}
  .valor-gerado .item .lbl{font-size:11.5px; color:#3E6B5D; margin-top:2px;}
  .destaque-item{padding:9px 12px; border-radius:8px; background:#FBFAF6; border:1px solid var(--line); margin-bottom:6px; font-size:13px;}
  .destaque-empty{padding:16px; text-align:center; color:var(--muted); font-size:13px; background:#FBFAF6; border-radius:8px; border:1px dashed var(--line);}
  .cid-rank-item{display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-radius:8px; background:#FBFAF6; border:1px solid var(--line); margin-bottom:5px; font-size:12.5px;}
  .cid-rank-item .cid-code{font-family:var(--serif); font-weight:700; color:var(--primary-dark); margin-right:8px;}
  .cid-rank-item .cid-count{background:var(--primary); color:#fff; border-radius:20px; font-size:11px; padding:1px 9px; font-weight:700;}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .pill-tabs{display:flex; gap:6px; background:#E9E5D8; padding:5px; border-radius:10px; width:100%; flex-wrap:wrap; margin-bottom:16px;}
  .pill-tab{padding:7px 13px; border-radius:7px; font-size:12.5px; font-weight:600; color:var(--muted); border:none; background:transparent; white-space:nowrap; transition:background .15s ease, box-shadow .15s ease;}
  .pill-tab.active{background:var(--surface); color:var(--primary-dark); box-shadow:0 1px 4px rgba(0,0,0,.1);}
  .pill-tab.big{font-size:13.5px; padding:9px 18px;}

  dialog{border:none; border-radius:14px; padding:0; width:min(600px,92vw); box-shadow:0 30px 60px -20px rgba(0,0,0,.4);}
  dialog::backdrop{background:rgba(20,30,28,.55);}
  .modal-head{padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  .modal-head h3{margin:0;}
  .modal-body{padding:20px 22px; max-height:65vh; overflow-y:auto;}
  .modal-foot{padding:14px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}
  .close-x{background:none; border:none; font-size:18px; color:var(--muted); line-height:1;}
  .checkbox-row{display:flex; align-items:center; gap:8px; margin:6px 0;}
  .checkbox-row input{width:auto;}
  .hidden{display:none !important;}
  .history-item{border-left:2px solid var(--primary); padding:6px 0 6px 14px; margin-bottom:10px; position:relative;}
  .history-item::before{content:''; position:absolute; left:-5px; top:9px; width:8px; height:8px; border-radius:50%; background:var(--primary);}
  .history-item .meta{font-size:11px; color:var(--muted);}
  .history-item img.thumb{max-width:200px; border-radius:8px; margin-top:7px; display:block; cursor:zoom-in; border:1px solid var(--line);}
  .subtask-row{display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:8px; margin-bottom:6px;}
  tr.row-clickable{cursor:pointer;}
  tr.row-clickable:hover td{background:#F2F6F1;}
  tr.row-clickable.row-expanded td{background:var(--primary-light); border-bottom-color:var(--primary-light);}
  .row-chevron{color:var(--primary); font-size:12px; text-align:center;}
  tr.row-expand-content td{padding:16px 8px 4px; background:#FBFAF7;}
  tr.row-expand-content:hover td{background:#FBFAF7;}
  .badge-count{background:var(--accent); color:#fff; border-radius:20px; font-size:10.5px; padding:1px 7px; margin-left:6px;}
  .note{font-size:12px; color:var(--muted); background:var(--primary-light); border-radius:8px; padding:9px 11px; margin-bottom:14px;}
  .note.warn{background:var(--accent-light); color:#6b501f;}
  .link-btn{background:none; border:none; color:var(--primary); font-weight:600; font-size:13px; padding:0;}
  .flex-between{display:flex; justify-content:space-between; align-items:center;}
  .tag-list{display:flex; gap:4px; flex-wrap:wrap;}
  .mini-tag{background:var(--primary-light); color:var(--primary-dark); border-radius:5px; font-size:11px; padding:2px 6px;}

  .perm-matrix{width:100%; border-collapse:collapse; font-size:12.5px;}
  .perm-matrix th, .perm-matrix td{border:1px solid var(--line); padding:6px 8px; text-align:center;}
  .perm-matrix th:first-child, .perm-matrix td:first-child{text-align:left;}
  .perm-matrix th{background:#FBFAF7; font-size:11px; text-transform:uppercase; color:var(--muted);}

  .lightbox-overlay{position:fixed; inset:0; background:rgba(10,20,18,.87); display:flex; align-items:center; justify-content:center; z-index:999; cursor:zoom-out; padding:30px;}
  .lightbox-overlay img{max-width:92vw; max-height:92vh; border-radius:10px; box-shadow:0 30px 70px rgba(0,0,0,.5);}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="login-selo-center"><img src="" data-src="SELO" alt="Selo Qualidade DTEL"></div>
    <h1 style="text-align:center;">Sistema de Gestão da Qualidade</h1>
    <p class="sub" style="text-align:center;">Acesse com seu usuário cadastrado.</p>
    <div class="field"><label>Usuário (e-mail)</label><select id="loginEmail"></select></div>
    <div class="field"><label>Senha</label><input type="password" id="loginSenha" placeholder="Digite sua senha"></div>
    <button class="btn block" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="loginError"></div>
    <div class="login-hint">Demo: <b>admin@empresa.com</b> / admin123 (Gestor) · <b>joana@empresa.com</b> / colab123 (Colaborador)</div>
    <div class="login-logo-corner"><img src="" data-src="LOGO" alt="DTEL"></div>
  </div>
</div>

<div id="app">
  <div id="topbar">
    <div class="brand">
      <button class="hamburger-btn" onclick="toggleSidebarMobile()">☰</button>
      <div class="brand-stack">
        <div class="mark"><img src="" data-src="LOGO" alt="DTEL"></div>
        <span class="brand-text">Gestão Administrativa<br>de Processos</span>
      </div>
    </div>
    <div class="who">
      <div class="bell-wrap">
        <button class="bell-btn" onclick="toggleNotifPanel()">🔔<span id="bellDot" class="bell-dot hidden">0</span></button>
        <div id="notifPanel" class="notif-panel"></div>
      </div>
      <span class="who-perfil">Perfil: <b id="whoRole">-</b></span>
      <span class="who-perfil">·</span>
      <span><b id="whoName">-</b></span>
      <button class="btn ghost small" onclick="logout()">Sair</button>
    </div>
  </div>
  <div id="sidebarBackdrop" onclick="closeSidebarMobile()"></div>
  <div id="sidebar">
    <div id="sidebarMenu"></div>
    <div class="sidebar-footer"><img src="" data-src="SELO" alt="Selo Qualidade DTEL"></div>
  </div>
  <div id="main"></div>
</div>

<dialog id="modal">
  <div class="modal-head"><h3 id="modalTitle">Título</h3><button class="close-x" onclick="closeModal()">✕</button></div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-foot" id="modalFoot"></div>
</dialog>

<script>
/* =========================================================================

const DB_KEY = 'sgq_db_v3';
const SESSION_KEY = 'sgq_session_v3';

function uid(p){ return p+'_'+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowStamp(){ const d=new Date(); return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateBR(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return d && m && y ? `${d}/${m}/${y}` : iso; }
function fmtMoney(n){ n = Number(n)||0; return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function monthKeyOf(iso){ return iso ? iso.slice(0,7) : ''; }
function thisMonthKey(){ return todayISO().slice(0,7); }
function prevMonthKey(){ const d=new Date(); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

let DB = null;
function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw){ try{ DB = JSON.parse(raw); ensureShape(); return; }catch(e){} }
  DB = seedDB(); saveDB();
}
function ensureShape(){
  ['documentos','naoConformidades','auditLog','conquistas','categoriasPatrimonio','acidentes','licencas','patrimonios'].forEach(k=>{ if(!DB[k]) DB[k]=[]; });
  if(DB.proximosPassos===undefined) DB.proximosPassos='';
  (DB.gruposPermissao||[]).forEach(g=>{
    if(g.modulos && !g.modulos.relatorios){ g.modulos.relatorios = g.nivel==='gestor' ? {ver:true,criar:true,editar:true,excluir:true} : {ver:false,criar:false,editar:false,excluir:false}; }
    if(g.modulos && !g.modulos.patrimonio){ g.modulos.patrimonio = g.nivel==='gestor' ? {ver:true,criar:true,editar:true,excluir:true} : {ver:true,criar:false,editar:false,excluir:false}; }
  });
  // Campo reservado para futura integração com Asana (preenchido quando o backend com a API existir)
  (DB.atividades||[]).forEach(a=>{ if(a.asanaTaskGid===undefined) a.asanaTaskGid=''; });
  (DB.projetos||[]).forEach(p=>{ if(p.asanaTaskGid===undefined) p.asanaTaskGid=''; });
  // Status de Patrimônio: migra de lista fixa para catálogo editável em Controle de Acesso
  if(!DB.statusPatrimonio || DB.statusPatrimonio.length===0){
    DB.statusPatrimonio = ['Em uso','Em manutenção','Reservado','Extraviado','Baixado'].map(nome=>({id:uid('spat'), nome}));
  }
  (DB.patrimonios||[]).forEach(p=>{
    if(p.statusPatrimonioId===undefined && p.status){
      const found = DB.statusPatrimonio.find(s=>s.nome===p.status);
      p.statusPatrimonioId = found ? found.id : DB.statusPatrimonio[0].id;
      delete p.status;
    } else if(p.statusPatrimonioId===undefined){
      p.statusPatrimonioId = DB.statusPatrimonio[0].id;
    }
  });
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }

/* ---------------------- Exportação CSV ---------------------- */
function exportCSV(filename, headers, rows){
  const esc2 = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const csv = [headers.map(esc2).join(';'), ...rows.map(r=>r.map(esc2).join(';'))].join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

/* ---------------------- Anexo de imagem (print) ---------------------- */
function fileToResizedDataURL(file, maxW){
  maxW = maxW || 640;
  return new Promise((resolve)=>{
    if(!file){ resolve(''); return; }
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
        const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.82));
      };
      img.onerror = ()=>resolve('');
      img.src = e.target.result;
    };
    reader.onerror = ()=>resolve('');
    reader.readAsDataURL(file);
  });
}
function historyImageHtml(h){

function itemVisible(it){
  if(it.gestorOnly) return isGestor();
  if(it.mod===null) return true;
  return canView(it.mod);
}
let OPEN_GROUP = null;
function toggleGroup(groupName){ OPEN_GROUP = (OPEN_GROUP===groupName) ? null : groupName; renderSidebar(); }
function renderSidebar(){
  const el = document.getElementById('sidebarMenu');
  el.innerHTML = MENU.map(g=>{
    const items = g.items.filter(itemVisible);
    if(items.length===0) return '';
    const isOpen = OPEN_GROUP === g.group;
    return `<div class="nav-group">
      <div class="nav-title nav-title-toggle" onclick="toggleGroup('${g.group}')"><span><span style="margin-right:7px;">${g.groupIcon||''}</span>${esc(g.group)}</span><span class="nav-chevron">${isOpen?'▾':'▸'}</span></div>
      <div class="nav-items ${isOpen?'':'hidden'}">
        ${items.map(it=>`<div class="nav-item ${ROUTE.section===it.key?'active':''}" onclick="navigate('${it.key}')"><span class="nav-icon">${it.icon}</span><span>${esc(it.label)}</span></div>`).join('')}
      </div>
    </div>`;
  }).join('');
}
function navigate(section){
  ROUTE = {section};
  const g = MENU.find(m=>m.items.some(it=>it.key===section));
  if(g) OPEN_GROUP = g.group;
  renderSidebar(); renderMain();
  closeSidebarMobile();
}

function renderCrudCatalogo(cat){
  const el = caEl(); const rows = DB[cat.key] || [];
  const podeCriar=can('controleAcesso','criar'), podeEditar=can('controleAcesso','editar'), podeExcluir=can('controleAcesso','excluir');
  el.innerHTML = `
    <div class="toolbar"><h3 style="margin:0;">${cat.icon} ${esc(cat.label)} <span class="badge-count">${rows.length}</span></h3>
      ${podeCriar?`<button class="btn" onclick="openCatalogoForm('${cat.key}')">+ Novo registro</button>`:''}</div>
    <div class="card">
      ${rows.length===0 ? emptyState('Nenhum registro ainda', 'Cadastre o primeiro item para usá-lo nos demais módulos do sistema.') : `
      <table><thead><tr>${cat.fields.map(f=>`<th>${esc(f.label)}</th>`).join('')}<th style="width:110px;">Ações</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>${cat.fields.map(f=>`<td>${renderFieldValue(f,r[f.name])}</td>`).join('')}
        <td class="table-actions">
          ${podeEditar?`<button class="btn ghost small" onclick="openCatalogoForm('${cat.key}','${r.id}')">Editar</button>`:''}
          ${podeExcluir?`<button class="btn danger small" onclick="deleteCatalogo('${cat.key}','${r.id}')">Excluir</button>`:''}
        </td></tr>`).join('')}</tbody></table>`}
    </div>`;
}
function renderFieldValue(f,val){
  if(f.type==='checkbox') return val ? '<span class="stamp ok">Sim</span>' : '<span class="stamp neutral">Não</span>';
  if(f.type==='select') return esc(nameFrom(f.source,val));
  return esc(val ?? '—');
}
function emptyState(title,sub){ return `<div class="empty-state"><div class="glyph">🗂️</div><div><b>${esc(title)}</b></div><div style="font-size:12.5px; margin-top:4px;">${esc(sub)}</div></div>`; }

function openCatalogoForm(catKey, id){
  const cat = catalogo(catKey); const editing = id ? DB[catKey].find(r=>r.id===id) : null;
  const body = cat.fields.map(f=>fieldHtml(f, editing ? editing[f.name] : '')).join('');
  openModal(editing?`Editar — ${cat.label}`:`Novo — ${cat.label}`, `<form id="catForm">${body}</form>`,
    `<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="submitCatalogoForm('${catKey}','${id||''}')">Salvar</button>`);
}
function fieldHtml(f, value){
  if(f.type==='select'){
    const opts = optionsFor(f.source).map(o=>`<option value="${o.id}" ${o.id===value?'selected':''}>${esc(o.nome)}</option>`).join('');
    return `<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label><select name="${f.name}"><option value="">Selecione…</option>${opts}</select></div>`;
  }
  if(f.type==='checkbox') return `<div class="checkbox-row"><input type="checkbox" name="${f.name}" id="chk_${f.name}" ${value?'checked':''}><label for="chk_${f.name}" style="margin:0;">${esc(f.label)}</label></div>`;
  if(f.type==='textarea') return `<div class="field"><label>${esc(f.label)}</label><textarea name="${f.name}">${esc(value||'')}</textarea></div>`;
  return `<div class="field"><label>${esc(f.label)}${f.required?' *':''}</label><input type="${f.type||'text'}" name="${f.name}" value="${esc(value||'')}"></div>`;
}
function readForm(formEl, fields){
  const data = {};
  fields.forEach(f=>{ data[f.name] = f.type==='checkbox' ? formEl.querySelector(`[name="${f.name}"]`).checked : formEl.querySelector(`[name="${f.name}"]`).value; });
  return data;
}
function submitCatalogoForm(catKey, id){
  const cat = catalogo(catKey); const form = document.getElementById('catForm');
  const missing = cat.fields.filter(f=>f.required && !form.querySelector(`[name="${f.name}"]`).value);
  if(missing.length){ alert('Preencha os campos obrigatórios: '+missing.map(f=>f.label).join(', ')); return; }
  const data = readForm(form, cat.fields);
  if(id){ Object.assign(DB[catKey].find(r=>r.id===id), data); logAction('Controle de Acesso','Editar',`Registro atualizado em "${cat.label}": ${data.nome||id}`); }
  else{ DB[catKey].push({id:uid(catKey.slice(0,3)), ...data}); logAction('Controle de Acesso','Criar',`Novo registro em "${cat.label}": ${data.nome||''}`); }
  saveDB(); closeModal(); renderCrudCatalogo(cat);
}
function deleteCatalogo(catKey, id){
  if(!confirm('Excluir este registro? Essa ação não pode ser desfeita.')) return;
  const cat = catalogo(catKey); const item = DB[catKey].find(r=>r.id===id);
  DB[catKey] = DB[catKey].filter(r=>r.id!==id);
  logAction('Controle de Acesso','Excluir',`Registro removido de "${cat.label}": ${item?.nome||id}`);
  saveDB(); renderCrudCatalogo(cat);
}

function submitUsuario(id){

function openGrupoForm(id){
  const g = id ? DB.gruposPermissao.find(x=>x.id===id) : null;

function submitGrupo(id){
  const nome=document.getElementById('f_nome').value.trim(), nivel=document.getElementById('f_nivel').value;
  if(!nome){ alert('Informe o nome do grupo.'); return; }
  const modulos={}; MODULOS_SISTEMA.forEach(m=>{ modulos[m.key]={ver:false,criar:false,editar:false,excluir:false}; });
  document.querySelectorAll('#permMatrix input[type=checkbox]').forEach(chk=>{ modulos[chk.dataset.mod][chk.dataset.act] = chk.checked; });
  if(id){ Object.assign(DB.gruposPermissao.find(x=>x.id===id), {nome,nivel,modulos}); logAction('Controle de Acesso','Editar',`Grupo de permissão atualizado: ${nome}`); }

  if(!confirm('Excluir este grupo de permissão?')) return;
  const g = DB.gruposPermissao.find(x=>x.id===id); DB.gruposPermissao = DB.gruposPermissao.filter(g=>g.id!==id);
  logAction('Controle de Acesso','Excluir',`Grupo de permissão removido: ${g?.nome||id}`);
  saveDB(); renderGruposPermissao();
}

      ${historico.length?historico.map(h=>`<div class="history-item"><div>${fmtMoney(h.valor)} <span class="meta">— ${fmtDateBR(h.data)} ${h.obs?'· '+esc(h.obs):''}</span></div></div>`).join(''):'<div class="meta">Sem histórico anterior.</div>'}</div>`:'<div class="note">O histórico salarial é iniciado automaticamente ao cadastrar.</div>'}`;

function submitColaborador(id){
  const nome=document.getElementById('f_nome').value.trim(), funcaoId=document.getElementById('f_funcao').value;
  const dataNascimento=document.getElementById('f_nasc').value, dataAdmissao=document.getElementById('f_adm').value;
  const salarioAtual=parseFloat(document.getElementById('f_sal').value||'0');
  if(!nome||!funcaoId||!dataNascimento||!dataAdmissao){ alert('Preencha todos os campos obrigatórios.'); return; }
  if(id){
    const c = DB.colaboradores.find(x=>x.id===id);
    if(c.salarioAtual !== salarioAtual){
      c.historicoSalarial = c.historicoSalarial || [];
      c.historicoSalarial.push({data:todayISO(), valor:salarioAtual, obs:'Atualização de salário'});
      logAction('Controle de Acesso','Editar (dado sensível)',`Salário atualizado para ${nome}: ${fmtMoney(salarioAtual)}`);
    }
    Object.assign(c, {nome,funcaoId,dataNascimento,dataAdmissao,salarioAtual});
    logAction('Controle de Acesso','Editar',`Colaborador atualizado: ${nome}`);
  } else {
    DB.colaboradores.push({id:uid('col'),nome,funcaoId,dataNascimento,dataAdmissao,salarioAtual,
      historicoSalarial:[{data:todayISO(), valor:salarioAtual, obs:'Admissão / cadastro inicial'}]});
    logAction('Controle de Acesso','Criar',`Colaborador cadastrado: ${nome}`);
  }
  saveDB(); closeModal(); renderColaboradores();
}
function deleteColaborador(id){
  if(DB.usuarios.some(u=>u.colaboradorId===id)){ alert('Não é possível excluir: há um usuário vinculado a este colaborador.'); return; }
  if(!confirm('Excluir este colaborador?')) return;
  const c = DB.colaboradores.find(x=>x.id===id); DB.colaboradores = DB.colaboradores.filter(c=>c.id!==id);
  logAction('Controle de Acesso','Excluir',`Colaborador removido: ${c?.nome||id}`);
  saveDB(); renderColaboradores();
}

      <tbody>${rows.map(c=>`<tr><td>${fmtDateBR(c.data)}</td><td>${esc(nameFrom('tiposCusto',c.tipoCustoId))}</td>
        <td>${esc(nameFrom('colaboradores',c.colaboradorId))}</td><td>${esc(nameFrom('categorias',c.categoriaId))}</td>
        <td>${esc(nameFrom('cidades',c.cidadeId))} / ${esc(nameFrom('bases',c.baseId))}</td>
        <td>${fmtMoney(c.valorCombustivel)}</td><td>${fmtMoney(c.valorAlimentacao)}</td><td>${c.km||0} km</td>
        <td>${c.projetoId?esc(nameFrom('projetos',c.projetoId)):'—'}</td>
        <td>${c.anexoNome?'<span class="stamp ok">Anexado</span>':'<span class="stamp neutral">—</span>'}</td>
        <td class="table-actions">${can('custos','excluir')?`<button class="btn danger small" onclick="deleteCusto('${c.id}')">Excluir</button>`:''}</td>
      </tr>`).join('')}</tbody></table>`}
    </div>`;
}
function exportarCustosCSV(){
  const meuColab = currentColaborador(); const rows = isGestor() ? DB.custos : DB.custos.filter(c=>c.colaboradorId===(meuColab?.id));
  exportCSV('custos.csv', ['Data','Tipo','Colaborador','Categoria','Cidade','Base','Combustível','Alimentação','KM','Projeto','Evidência','Observação'],
    rows.map(c=>[fmtDateBR(c.data), nameFrom('tiposCusto',c.tipoCustoId), nameFrom('colaboradores',c.colaboradorId), nameFrom('categorias',c.categoriaId),
      nameFrom('cidades',c.cidadeId), nameFrom('bases',c.baseId), c.valorCombustivel, c.valorAlimentacao, c.km, c.projetoId?nameFrom('projetos',c.projetoId):'', c.anexoNome||'', c.obs||'']));
}
function openCustoForm(){
  const tiposOpts = DB.tiposCusto.map(t=>`<option value="${t.id}" data-anexo="${t.exigeAnexo?'1':'0'}">${esc(t.nome)}</option>`).join('');
  const catOpts = DB.categorias.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');
  const cidOpts = DB.cidades.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');
  const baseOpts = DB.bases.map(b=>`<option value="${b.id}">${esc(b.nome)}</option>`).join('');
  const projOpts = DB.projetos.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('');
  const colabOpts = DB.colaboradores.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');
  const meuColab = currentColaborador();
  const body = `
    <div class="field"><label>Tipo de custo *</label><select id="f_tipo" onchange="onTipoCustoChange()"><option value="">Selecione o tipo de custo…</option>${tiposOpts}</select></div>
    <div id="custoCamposDinamicos" class="hidden">
      <div class="field"><label>Colaborador *</label><select id="f_colab">${meuColab?`<option value="${meuColab.id}" selected>${esc(meuColab.nome)}</option>`:'<option value="">Selecione…</option>'+colabOpts}</select></div>
      <div class="grid cols-3">
        <div class="field"><label>Combustível (R$)</label><input type="number" step="0.01" id="f_comb" value="0"></div>
        <div class="field"><label>Alimentação (R$)</label><input type="number" step="0.01" id="f_alim" value="0"></div>
        <div class="field"><label>KM percorrido</label><input type="number" step="1" id="f_km" value="0"></div>
      </div>
      <div class="grid cols-2">
        <div class="field"><label>Categoria</label><select id="f_cat"><option value="">Selecione…</option>${catOpts}</select></div>
        <div class="field"><label>Cidade</label><select id="f_cid"><option value="">Selecione…</option>${cidOpts}</select></div>
        <div class="field"><label>Base</label><select id="f_base"><option value="">Selecione…</option>${baseOpts}</select></div>
        <div class="field"><label>Vínculo do Projeto (opcional)</label><select id="f_proj"><option value="">Nenhum</option>${projOpts}</select></div>
      </div>
      <div class="field"><label>Data</label><input type="date" id="f_data" value="${todayISO()}"></div>
      <div class="field"><label>Observações</label><textarea id="f_obs"></textarea></div>
      <div id="anexoWrap" class="hidden"><div class="field"><label>Anexo de evidência (obrigatório para este tipo de custo) *</label><input type="file" id="f_anexo"></div></div>
    </div>`;
  openModal('Novo lançamento de custo', body, `<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="submitCusto()">Salvar</button>`);
}
function onTipoCustoChange(){
  const sel=document.getElementById('f_tipo'); const opt=sel.options[sel.selectedIndex];
  const campos=document.getElementById('custoCamposDinamicos'); const anexoWrap=document.getElementById('anexoWrap');
  if(!sel.value){ campos.classList.add('hidden'); return; }
  campos.classList.remove('hidden');
  if(opt.dataset.anexo==='1'){ anexoWrap.classList.remove('hidden'); } else { anexoWrap.classList.add('hidden'); }
}
function submitCusto(){
  const tipoCustoId=document.getElementById('f_tipo').value;
  if(!tipoCustoId){ alert('Selecione o tipo de custo.'); return; }
  const tipo = DB.tiposCusto.find(t=>t.id===tipoCustoId);
  const colaboradorId=document.getElementById('f_colab').value;
  if(!colaboradorId){ alert('Selecione o colaborador.'); return; }
  const anexoInput = document.getElementById('f_anexo'); const anexoNome = anexoInput && anexoInput.files[0] ? anexoInput.files[0].name : '';
  if(tipo.exigeAnexo && !anexoNome){ alert('Este tipo de custo exige anexo de evidência.'); return; }
  DB.custos.push({ id:uid('cst'), tipoCustoId, colaboradorId,
    valorCombustivel:parseFloat(document.getElementById('f_comb').value||'0'),
    valorAlimentacao:parseFloat(document.getElementById('f_alim').value||'0'),
    km:parseFloat(document.getElementById('f_km').value||'0'),
    categoriaId:document.getElementById('f_cat').value, cidadeId:document.getElementById('f_cid').value,
    baseId:document.getElementById('f_base').value, projetoId:document.getElementById('f_proj').value,
    data:document.getElementById('f_data').value || todayISO(), obs:document.getElementById('f_obs').value, anexoNome });
  logAction('Custos','Criar',`Lançamento de custo (${tipo.nome}) para ${nameFrom('colaboradores',colaboradorId)}`);
  saveDB(); closeModal(); renderCustos();
}
function deleteCusto(id){ if(!confirm('Excluir este lançamento de custo?')) return; DB.custos = DB.custos.filter(c=>c.id!==id); logAction('Custos','Excluir',`Lançamento removido (id ${id})`); saveDB(); renderCustos(); }

const CID10_MAP = new Map(CID10_LISTA.map(c=>[c.codigo, c.descricao]));
function lookupCID(codigo){
  if(!codigo) return '';
  return CID10_MAP.get(codigo.trim().toUpperCase()) || '';
}
function inserirSignificadoCID(codeInputId, obsTextareaId, hintId){
  const code = document.getElementById(codeInputId).value.trim().toUpperCase();
  const hint = document.getElementById(hintId);
  const textarea = document.getElementById(obsTextareaId);
  const desc = lookupCID(code);
  if(!code){ if(hint) hint.textContent=''; return; }
  if(desc){
    if(hint){ hint.textContent = '✓ Significado: '+desc; hint.style.color='var(--primary)'; }
    if(textarea){
      const marcador = /^CID [A-Z0-9.]+ — .*\n?/;
      const linhaCID = `CID ${code} — ${desc}`;
      textarea.value = marcador.test(textarea.value) ? textarea.value.replace(marcador, linhaCID+'\n') : (textarea.value ? linhaCID+'\n'+textarea.value : linhaCID);
    }
  } else {
    if(hint){ hint.textContent = 'CID não encontrado na base local — descreva o motivo manualmente na observação. (Referência completa: tabela CID-10 do DATASUS)'; hint.style.color='var(--muted)'; }
  }
}

function submitAtestado(){
  const colaboradorId=document.getElementById('f_colab').value, dataInicio=document.getElementById('f_ini').value, dataFim=document.getElementById('f_fim').value;
  if(!colaboradorId||!dataInicio||!dataFim){ alert('Preencha colaborador, início e fim.'); return; }
  const dias = Math.max(1, daysBetween(dataInicio,dataFim)+1);
  const cid = document.getElementById('f_cidDoenca').value.trim().toUpperCase();
  DB.atestados.push({id:uid('att'), colaboradorId, dataInicio, dataFim, dias, cid, obs:document.getElementById('f_obs').value});
  logAction('Gestão de Pessoas','Criar',`Atestado lançado para ${nameFrom('colaboradores',colaboradorId)} (${dias} dia(s))${cid?' — CID '+cid:''}`);
  saveDB(); closeModal(); renderAtestados();
}

  t.cargaHoraria = parseFloat(document.getElementById('cargaTreino_'+id).value||'0');
  t.obs = document.getElementById('obsTreino_'+id).value;
  logAction('Gestão de Pessoas','Editar',`Treinamento "${t.nome}" atualizado`);
  saveDB(); renderTreinamentos();
}
function openTreinamentoForm(){
  const meuColab = currentColaborador(); const colabOpts = DB.colaboradores.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');
  const body = `<div class="field"><label>Colaborador *</label><select id="f_colab">${meuColab?`<option value="${meuColab.id}" selected>${esc(meuColab.nome)}</option>`:'<option value="">Selecione…</option>'+colabOpts}</select></div>
    <div class="field"><label>Nome do treinamento *</label><input id="f_nome"></div>
    <div class="grid cols-2"><div class="field"><label>Data *</label><input type="date" id="f_data" value="${todayISO()}"></div><div class="field"><label>Carga horária (h) *</label><input type="number" id="f_carga" value="4"></div></div>
    <div class="field"><label>Observação</label><textarea id="f_obs"></textarea></div>`;
  openModal('Lançar treinamento', body, `<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="submitTreinamento()">Salvar</button>`);
}
function submitTreinamento(){
  const colaboradorId=document.getElementById('f_colab').value, nome=document.getElementById('f_nome').value.trim();
  const data=document.getElementById('f_data').value, cargaHoraria=parseFloat(document.getElementById('f_carga').value||'0');
  if(!colaboradorId||!nome||!data){ alert('Preencha todos os campos obrigatórios.'); return; }
  DB.treinamentos.push({id:uid('trn'), colaboradorId, nome, data, cargaHoraria, obs:document.getElementById('f_obs').value});
  logAction('Gestão de Pessoas','Criar',`Treinamento "${nome}" lançado para ${nameFrom('colaboradores',colaboradorId)}`);
  saveDB(); closeModal(); renderTreinamentos();
}
function deleteTreinamento(id){ if(!confirm('Excluir este treinamento?'))return; DB.treinamentos=DB.treinamentos.filter(t=>t.id!==id); logAction('Gestão de Pessoas','Excluir','Treinamento removido'); saveDB(); renderTreinamentos(); }

function openAcidenteForm(){

    </div>
    <div class="field"><label>CID (opcional)</label><input list="cidListAcidente" id="f_cidAcidente" placeholder="Ex: S93.4" oninput="inserirSignificadoCID('f_cidAcidente','f_descAcidente','cidHintAcidente')">

      <div id="cidHintAcidente" style="font-size:11.5px; margin-top:4px; color:var(--muted);"></div>

    <div class="checkbox-row"><input type="checkbox" id="f_catEmitida" onchange="document.getElementById('numeroCATWrap').style.display=this.checked?'block':'none'"><label style="margin:0;" for="f_catEmitida">CAT (Comunicação de Acidente de Trabalho) emitida</label></div>
    <div class="field" id="numeroCATWrap" style="display:none;"><label>Número da CAT</label><input id="f_numeroCAT"></div>
    <div class="field"><label>Descrição do acidente *</label><textarea id="f_descAcidente" placeholder="O que aconteceu, como e onde…"></textarea></div>
    <div class="field"><label>Anexar evidência (foto do local/laudo, opcional)</label><input type="file" id="f_anexoAcidente" accept="image/*"></div>`;
  openModal('Registrar acidente de trabalho', body, `<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="submitAcidente()">Registrar</button>`);
}
function onTipoAfastamentoChange(){
  const tipo = document.getElementById('f_tipoAfastamento').value;
  document.getElementById('diasAfastamentoWrap').style.display = tipo==='Com afastamento' ? 'block' : 'none';
}
async function submitAcidente(){
  const colaboradorId=document.getElementById('f_colab').value, data=document.getElementById('f_data').value;
  const descricao=document.getElementById('f_descAcidente').value.trim();
  if(!colaboradorId||!data||!descricao){ alert('Preencha colaborador, data e descrição.'); return; }
  const tipoAfastamento = document.getElementById('f_tipoAfastamento').value;
  const diasAfastamento = tipoAfastamento==='Com afastamento' ? parseInt(document.getElementById('f_diasAfastamento').value||'0') : 0;
  const cid = document.getElementById('f_cidAcidente').value.trim().toUpperCase();
  const catEmitida = document.getElementById('f_catEmitida').checked;
  const numeroCAT = catEmitida ? document.getElementById('f_numeroCAT').value.trim() : '';
  const baseId = document.getElementById('f_base').value;
  const file = document.getElementById('f_anexoAcidente').files[0];
  const anexo = await fileToResizedDataURL(file);
  DB.acidentes.push({id:uid('aci'), colaboradorId, data, baseId, tipoAfastamento, diasAfastamento, cid, catEmitida, numeroCAT, descricao, obs:'', anexo, status:'Em investigação'});
  logAction('Gestão de Pessoas','Criar',`Acidente de trabalho registrado para ${nameFrom('colaboradores',colaboradorId)} (${tipoAfastamento})`);
  saveDB(); closeModal(); renderAcidentes();
}
function atualizarAcidente(id){
  const a = DB.acidentes.find(x=>x.id===id);
  a.status = document.getElementById('statusAcidente_'+id).value;
  a.obs = document.getElementById('obsAcidente_'+id).value;
  logAction('Gestão de Pessoas','Editar',`Acidente de ${nameFrom('colaboradores',a.colaboradorId)} atualizado — status "${a.status}"`);
  saveDB(); renderAcidentes();
}
function deleteAcidente(id){ if(!confirm('Excluir este registro de acidente?'))return; DB.acidentes=DB.acidentes.filter(a=>a.id!==id); logAction('Gestão de Pessoas','Excluir','Registro de acidente removido'); saveDB(); renderAcidentes(); }

function openLicencaForm(){
  const meuColab = currentColaborador(); const colabOpts = DB.colaboradores.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');
  const body = `<div class="field"><label>Colaborador *</label><select id="f_colab">${meuColab?`<option value="${meuColab.id}" selected>${esc(meuColab.nome)}</option>`:'<option value="">Selecione…</option>'+colabOpts}</select></div>
    <div class="field"><label>Tipo *</label><select id="f_tipoLicenca" onchange="onTipoLicencaChange()"><option value="">Selecione…</option>${TIPO_LICENCA.map(t=>`<option value="${t}">${t}</option>`).join('')}</select></div>
    <div class="grid cols-2">
      <div class="field"><label>Data início *</label><input type="date" id="f_ini" onchange="onTipoLicencaChange()"></div>
      <div class="field"><label>Data fim *</label><input type="date" id="f_fim"></div>
    </div>
    <div class="note" id="licencaHint">Selecione o tipo e a data de início para sugerir a data de término (ajuste conforme orientação do RH/adesão ao Empresa Cidadã).</div>
    <div class="field"><label>Observação</label><textarea id="f_obs"></textarea></div>`;
  openModal('Lançar licença', body, `<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="submitLicenca()">Salvar</button>`);
}
function onTipoLicencaChange(){
  const tipo = document.getElementById('f_tipoLicenca').value;
  const ini = document.getElementById('f_ini').value;
  const hint = document.getElementById('licencaHint');
  if(!tipo || !ini){ return; }
  const dias = tipo==='Maternidade' ? 119 : 4;
  document.getElementById('f_fim').value = addDaysISO(ini, dias);
  hint.textContent = tipo==='Maternidade'
    ? 'Sugestão: 120 dias corridos (licença-maternidade padrão). Se a empresa aderir ao Empresa Cidadã, o prazo pode chegar a 180 dias — ajuste a data fim se for o caso.'
    : 'Sugestão: 5 dias corridos (licença-paternidade padrão). Se a empresa aderir ao Empresa Cidadã, o prazo pode chegar a 20 dias — ajuste a data fim se for o caso.';
}
function submitLicenca(){
  const colaboradorId=document.getElementById('f_colab').value, tipo=document.getElementById('f_tipoLicenca').value;
  const dataInicio=document.getElementById('f_ini').value, dataFim=document.getElementById('f_fim').value;
  if(!colaboradorId||!tipo||!dataInicio||!dataFim){ alert('Preencha todos os campos obrigatórios.'); return; }
  DB.licencas.push({id:uid('lic'), colaboradorId, tipo, dataInicio, dataFim, obs:document.getElementById('f_obs').value});
  logAction('Gestão de Pessoas','Criar',`Licença ${tipo.toLowerCase()} lançada para ${nameFrom('colaboradores',colaboradorId)}`);
  saveDB(); closeModal(); renderLicencas();
}
function atualizarLicencaObs(id){
  const l = DB.licencas.find(x=>x.id===id); l.obs = document.getElementById('obsLicenca_'+id).value;
  logAction('Gestão de Pessoas','Editar',`Observação da licença de ${nameFrom('colaboradores',l.colaboradorId)} atualizada`);
  saveDB(); renderLicencas();
}
function deleteLicenca(id){ if(!confirm('Excluir esta licença?'))return; DB.licencas=DB.licencas.filter(l=>l.id!==id); logAction('Gestão de Pessoas','Excluir','Licença removida'); saveDB(); renderLicencas(); }

/* ---------------------- PATRIMÔNIO ---------------------- */
let PATRIMONIO_EXPANDIDO = null;
function togglePatrimonioExpand(id){ PATRIMONIO_EXPANDIDO = (PATRIMONIO_EXPANDIDO===id) ? null : id; renderPatrimonio(); }
function garantiaStamp(garantiaAte){
  if(!garantiaAte) return '';
  if(garantiaAte < todayISO()) return ' <span class="stamp bad">Garantia vencida</span>';
  if(daysBetween(todayISO(), garantiaAte) <= 60) return ' <span class="stamp warn">Garantia vencendo</span>';
  return '';
}
function renderPatrimonio(){
  const el=document.getElementById('main'); const meuColab = currentColaborador();
  const rows = isGestor() ? DB.patrimonios : DB.patrimonios.filter(p=>p.responsavelId===(meuColab?.id));
  el.innerHTML=`
    <div class="page-head"><div><div class="crumb">Patrimônio</div><h2>📦 Gestão de Patrimônio</h2><p>${rows.length} item(ns)${isGestor()?'':' — exibindo apenas os seus'} · clique para expandir</p></div>
      <div class="head-actions"><button class="btn ghost" onclick="exportarPatrimonioCSV()">⬇ Exportar CSV</button>
        ${can('patrimonio','criar')?`<button class="btn" onclick="openPatrimonioForm()">+ Cadastrar patrimônio</button>`:''}</div></div>
    <div class="note">Cadastre o código exatamente como está na etiqueta física do item, para manter a rastreabilidade entre o sistema e o patrimônio físico.</div>

      ${rows.length===0?emptyState('Nenhum patrimônio cadastrado','Cadastre os itens de patrimônio do seu setor usando o código da etiqueta física.'):`

      <tbody>${rows.map(p=>{

        const headerRow = `<tr class="row-clickable ${expanded?'row-expanded':''}" onclick="togglePatrimonioExpand('${p.id}')">
          <td class="row-chevron">${expanded?'▾':'▸'}</td>
          <td><b>${esc(p.codigoPatrimonio)}</b></td><td>${esc(p.descricao)}</td>
          <td>${esc(nameFrom('categoriasPatrimonio',p.categoriaPatrimonioId))}</td>
          <td>${p.responsavelId?esc(nameFrom('colaboradores',p.responsavelId)):'<span style="color:var(--muted);">Sem responsável</span>'}</td>
          <td>${esc(nameFrom('bases',p.baseId))}</td>

        return headerRow + expandRow;
      }).join('')}</tbody></table>`}
    </div>`;

function exportarPatrimonioCSV(){
  const meuColab = currentColaborador();

      <div class="field"><label>Garantia até</label><input type="date" id="f_garantiaAte"></div>

  openModal('Cadastrar patrimônio', body, `<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="submitPatrimonio()">Cadastrar</button>`);

function submitPatrimonio(){
  const codigoPatrimonio = document.getElementById('f_codigoPat').value.trim();
  const descricao = document.getElementById('f_descPat').value.trim();
  const categoriaPatrimonioId = document.getElementById('f_catPat').value;
  if(!codigoPatrimonio||!descricao||!categoriaPatrimonioId){ alert('Preencha código, descrição e categoria.'); return; }
  if(DB.patrimonios.some(p=>p.codigoPatrimonio.toLowerCase()===codigoPatrimonio.toLowerCase())){

async function atualizarPatrimonio(id){
  const p = DB.patrimonios.find(x=>x.id===id);
  const novoStatusId = document.getElementById('statusPat_'+id).value;
  const novoStatusNome = nameFrom('statusPatrimonio', novoStatusId);
  const novoResponsavel = document.getElementById('respPat_'+id).value;
  const novaBase = document.getElementById('basePat_'+id).value;
  const texto = document.getElementById('novaObsPat').value.trim();
  if(!texto){ alert('Escreva uma observação sobre esta atualização.'); return; }
  const mudancas = [];
  if(novoResponsavel !== p.responsavelId){ mudancas.push(`responsável alterado para ${novoResponsavel?nameFrom('colaboradores',novoResponsavel):'sem responsável'}`); }
  if(novaBase !== p.baseId){ mudancas.push(`localização alterada para ${nameFrom('bases',novaBase)}`); }
  if(novoStatusId !== p.statusPatrimonioId){ mudancas.push(`status alterado para "${novoStatusNome}"`); }
  if(/baixad/i.test(novoStatusNome)){ p.motivoBaixa = document.getElementById('motivoBaixaPat_'+id).value.trim(); }
  p.statusPatrimonioId = novoStatusId; p.responsavelId = novoResponsavel; p.baseId = novaBase;
  const file = document.getElementById('anexoObsPat').files[0]; const imagem = await fileToResizedDataURL(file);
  const textoCompleto = mudancas.length ? `${texto} (${mudancas.join('; ')})` : texto;
  p.historico = p.historico || [];
  p.historico.push({data:nowStamp(), autor:currentUser().nome, texto:textoCompleto, status:novoStatusNome, imagem});
  logAction('Patrimônio','Atualizar',`Patrimônio "${p.codigoPatrimonio}" atualizado${mudancas.length?': '+mudancas.join('; '):''}`);
  saveDB(); renderPatrimonio();
}

function salvarEdicaoObsPatrimonio(patId, idx){
  const p = DB.patrimonios.find(x=>x.id===patId); const h = p.historico[idx];

function deletePatrimonio(id){
  if(!confirm('Excluir este cadastro de patrimônio? Essa ação não pode ser desfeita.')) return;
  const p = DB.patrimonios.find(x=>x.id===id); DB.patrimonios = DB.patrimonios.filter(x=>x.id!==id);
  logAction('Patrimônio','Excluir',`Patrimônio removido: ${p?.codigoPatrimonio||id}`);

}



/* ---------------------- Helpers de status ---------------------- */
function statusStamp(nome){
  if(!nome || nome==='—') return '<span class="stamp neutral">—</span>';
  const n = nome.toLowerCase(); let cls='neutral';
  if(/aprov|conclu|ativ|public/.test(n)) cls='ok';
  else if(/cancel|atras|reprov|obsolet/.test(n)) cls='bad';
  else if(/valid|andamento|execu|planej|abert|revis|tratativa|rascunho|análise/.test(n)) cls='warn';
  return `<span class="stamp ${cls}">${esc(nome)}</span>`;
}
function slaStamp(prazo, statusNome){
  const concluida = /conclu|cancel|aprov|public/i.test(statusNome||'');
  if(concluida) return '';
  if(prazo && prazo < todayISO()) return ' <span class="stamp bad">SLA estourado</span>';
  return '';
}

function openEditarObsProjeto(projId, idx){
  const p = DB.projetos.find(x=>x.id===projId); const h = p.historico[idx];
  openModal('Corrigir observação', `<div class="field"><label>Texto da observação</label><textarea id="editObsTextoProj">${esc(h.texto)}</textarea></div>
    <div class="note">O texto original fica preservado e visível (passe o mouse sobre a marca "editado" no histórico), para manter o registro auditável.</div>`,
    `<button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" onclick="salvarEdicaoObsProjeto('${projId}',${idx})">Salvar correção</button>`);
}
function salvarEdicaoObsProjeto(projId, idx){
  const p = DB.projetos.find(x=>x.id===projId); const h = p.historico[idx];
  const novoTexto = document.getElementById('editObsTextoProj').value.trim();
  if(!novoTexto){ alert('A observação não pode ficar vazia.'); return; }
  const textoAnterior = h.textoOriginal || h.texto;
  if(!h.editado){ h.textoOriginal = h.texto; }
  h.texto = novoTexto; h.editado = true; h.dataEdicao = nowStamp(); h.autorEdicao = currentUser().nome;
  logAction('Produtividade','Editar observação', `Observação do projeto "${p.nome}" corrigida: "${textoAnterior}" → "${novoTexto}"`);
  saveDB(); closeModal(); renderProjetos();
}
async function atualizarProjeto(id){
  const p = DB.projetos.find(x=>x.id===id); const novoStatusId = document.getElementById('novoStatusProj').value;
  const texto = document.getElementById('novaObsProj').value.trim();
  if(!texto){ alert('Escreva uma observação sobre esta atualização.'); return; }
  const file = document.getElementById('anexoObsProj').files[0]; const imagem = await fileToResizedDataURL(file);
  p.statusProjetoId = novoStatusId; p.historico = p.historico || [];
  p.historico.push({data:nowStamp(), autor:currentUser().nome, texto, status:nameFrom('statusProjeto',novoStatusId), imagem});
  logAction('Produtividade','Atualizar',`Projeto "${p.nome}" atualizado para status "${nameFrom('statusProjeto',novoStatusId)}"`);
  saveDB(); renderProjetos();
}

let NC_EXPANDIDO = null;

function renderNaoConformidades(){
  const el=document.getElementById('main'); const meuColab = currentColaborador();

        ${can('naoConformidades','criar')?`<button class="btn" onclick="openNCForm()">+ Registrar não conformidade</button>`:''}</div></div>
    <div class="card">

          <td class="row-chevron">${expanded?'▾':'▸'}</td>

          <td>${fmtDateBR(n.dataOcorrencia)}</td><td>${n.atividadeVinculadaId?'<span class="stamp ok">Sim</span>':'<span class="stamp neutral">Não</span>'}</td>

function submitNC(){
  const titulo=document.getElementById('f_titulo').value.trim(), descricao=document.getElementById('f_desc').value.trim();
  const responsavelId=document.getElementById('f_resp').value, dataOcorrencia=document.getElementById('f_data').value;

  const planoAcao=document.getElementById('f_plano').value;
  const nc = { id:uid('nc'), titulo, descricao, categoriaId:document.getElementById('f_cat').value, cidadeId:document.getElementById('f_cid').value,
    baseId:document.getElementById('f_base').value, dataOcorrencia, responsavelId, causaRaiz:document.getElementById('f_causa').value, planoAcao,
    status:'Aberta', atividadeVinculadaId:'', historico:[{data:nowStamp(), autor:currentUser().nome, texto:'Não conformidade registrada.', status:'Aberta'}] };
  DB.naoConformidades.push(nc); logAction('Não Conformidades','Criar',`NC registrada: ${titulo}`); saveDB();
  const gerar = document.getElementById('f_gerarAtiv').checked; closeModal();
  if(gerar){ openAtividadeForm({titulo:'Ação corretiva: '+titulo, responsavelId, prazo:addDaysISO(dataOcorrencia,15), descricao:planoAcao||descricao, origemNCId:nc.id}); }
  else { NC_EXPANDIDO = nc.id; renderNaoConformidades(); }
}

/* ---------------------- CONTROLE DOCUMENTAL ---------------------- */
let DOC_EXPANDIDO = null;
function toggleDocExpand(id){ DOC_EXPANDIDO = (DOC_EXPANDIDO===id) ? null : id; renderDocumentos(); }
function proximaRevisao(doc){ return addDaysISO(doc.dataUltimaRevisao, doc.periodicidadeRevisaoDias||365); }
function renderDocumentos(){
  const el=document.getElementById('main'); const rows = DB.documentos;
  el.innerHTML=`
    <div class="page-head"><div><div class="crumb">Qualidade</div><h2>📚 Controle Documental</h2><p>${rows.length} documento(s) — fluxo Rascunho → Em revisão → Aprovado → Publicado → Obsoleto, com alerta de revisão periódica · clique para expandir</p></div>
      ${can('documentos','criar')?`<button class="btn" onclick="openDocumentoForm()">+ Novo documento</button>`:''}</div>
    <div class="card">
      ${rows.length===0?emptyState('Nenhum documento cadastrado','Registre POPs, instruções de trabalho e demais documentos controlados.'):`
      <table><thead><tr><th style="width:22px;"></th><th>Nome</th><th>Tipo</th><th>Versão</th><th>Status do fluxo</th><th>Responsável</th><th>Próxima revisão</th></tr></thead>
      <tbody>${rows.map(d=>{ const prox = proximaRevisao(d); const vencido = prox < todayISO(); const proximo = !vencido && daysBetween(todayISO(), prox) <= 30;
        const expanded = DOC_EXPANDIDO===d.id;
        const headerRow = `<tr class="row-clickable ${expanded?'row-expanded':''}" onclick="toggleDocExpand('${d.id}')">
          <td class="row-chevron">${expanded?'▾':'▸'}</td>
          <td><b>${esc(d.nome)}</b> <span style="color:var(--muted); font-size:12px;">v${esc(d.versao)}</span></td><td>${esc(nameFrom('tiposDocumento',d.tipoDocumentoId))}</td><td>v${esc(d.versao)}</td>
          <td>${statusStamp(d.statusFluxo)}</td><td>${esc(nameFrom('colaboradores',d.responsavelId))}</td>
          <td>${fmtDateBR(prox)} ${vencido?'<span class="stamp bad">Vencida</span>':proximo?'<span class="stamp warn">Em breve</span>':''}</td>
        </tr>`;
        const expandRow = expanded ? `<tr class="row-expand-content"><td colspan="7">${renderDocumentoDetalheInline(d)}</td></tr>` : '';
        return headerRow + expandRow;
      }).join('')}</tbody></table>`}

/* ---------------------- NOTIFICAÇÕES ---------------------- */
function computeNotificacoes(){
  const notifs = []; const meuColab = currentColaborador(); const gestor = isGestor();
  const limite3 = addDaysISO(todayISO(),3), limite7 = addDaysISO(todayISO(),7), limite15 = addDaysISO(todayISO(),15);
  const atividadesRelevantes = gestor ? DB.atividades : DB.atividades.filter(a=>a.responsavelId===(meuColab?.id));
  atividadesRelevantes.forEach(a=>{
    const statusNome = nameFrom('statusDocumento', a.statusId); if(/conclu|cancel/i.test(statusNome)) return;
    if(a.prazo < todayISO()) notifs.push({texto:`Atividade atrasada: "${a.titulo}" (prazo ${fmtDateBR(a.prazo)})`, bad:true});
    else if(a.prazo <= limite3) notifs.push({texto:`Atividade "${a.titulo}" vence em breve (${fmtDateBR(a.prazo)})`, bad:false});
  });
  const projetosRelevantes = gestor ? DB.projetos : DB.projetos.filter(p=>(p.responsaveis||[]).includes(meuColab?.id));
  projetosRelevantes.forEach(p=>{
    const statusNome = nameFrom('statusProjeto', p.statusProjetoId); if(/conclu/i.test(statusNome)) return;
    if(p.prazo < todayISO()) notifs.push({texto:`Projeto atrasado: "${p.nome}" (prazo ${fmtDateBR(p.prazo)})`, bad:true});
    else if(p.prazo <= limite3) notifs.push({texto:`Projeto "${p.nome}" vence em breve (${fmtDateBR(p.prazo)})`, bad:false});
  });
  const feriasRelevantes = gestor ? DB.ferias : DB.ferias.filter(f=>f.colaboradorId===(meuColab?.id));
  feriasRelevantes.forEach(f=>{ if(f.dataInicio >= todayISO() && f.dataInicio <= limite7){ notifs.push({texto:`Férias de ${nameFrom('colaboradores',f.colaboradorId)} começam em ${fmtDateBR(f.dataInicio)}`, bad:false}); } });
  if(gestor){
    DB.documentos.forEach(d=>{ const prox = proximaRevisao(d);
      if(prox < todayISO()) notifs.push({texto:`Revisão vencida: "${d.nome}" (previsto ${fmtDateBR(prox)})`, bad:true});
      else if(prox <= limite15) notifs.push({texto:`Revisão próxima: "${d.nome}" (previsto ${fmtDateBR(prox)})`, bad:false}); });
    const ncAbertas = DB.naoConformidades.filter(n=>!/conclu|reprov/i.test(n.status));
    if(ncAbertas.length) notifs.push({texto:`${ncAbertas.length} não conformidade(s) em aberto aguardando tratativa`, bad:ncAbertas.length>3});
  }
  return notifs;
}
function renderBell(){
  const notifs = computeNotificacoes(); const dot = document.getElementById('bellDot');
  if(notifs.length===0){ dot.classList.add('hidden'); } else { dot.classList.remove('hidden'); dot.textContent = notifs.length>9?'9+':notifs.length; }
  const panel = document.getElementById('notifPanel');
  panel.innerHTML = notifs.length===0 ? '<div class="notif-empty">Nenhuma notificação no momento.</div>' : notifs.map(n=>`<div class="notif-item ${n.bad?'bad':''}">${esc(n.texto)}</div>`).join('');
}
function toggleNotifPanel(){ document.getElementById('notifPanel').classList.toggle('open'); }
document.addEventListener('click', (e)=>{ const wrap = document.querySelector('.bell-wrap'); if(wrap && !wrap.contains(e.target)) document.getElementById('notifPanel')?.classList.remove('open'); });

const DIAS_UTEIS_MES = 22;
function periodBounds(sel){
  const hoje = new Date();
  const y = hoje.getFullYear(), m = hoje.getMonth();
  const first = (yy,mm)=> new Date(yy,mm,1).toISOString().slice(0,10);
  const last = (yy,mm)=> new Date(yy,mm+1,0).toISOString().slice(0,10);
  switch(sel){
    case 'mes_atual': return {ini:first(y,m), fim:todayISO(), label:'Mês atual'};
    case 'mes_passado': return {ini:first(y,m-1), fim:last(y,m-1), label:'Mês passado'};
    case 'ult_3m': return {ini:first(y,m-2), fim:todayISO(), label:'Últimos 3 meses'};
    case 'ult_6m': return {ini:first(y,m-5), fim:todayISO(), label:'Últimos 6 meses'};
    case 'ano_atual': return {ini:first(y,0), fim:todayISO(), label:'Este ano'};
    case 'ano_passado': return {ini:first(y-1,0), fim:last(y-1,11), label:'Ano passado'};
    default: return {ini:'0000-01-01', fim:'9999-12-31', label:'Todos os períodos'};
  }
}
function inPeriod(dateISO, bounds){ return !!dateISO && dateISO>=bounds.ini && dateISO<=bounds.fim; }

    return {nome:c.nome, qtd:itens.length, dias, pct: dias>0 ? (dias/DIAS_UTEIS_MES)*100 : 0};

  const totalDias = rows.reduce((s,r)=>s+r.dias,0);

/* --- Comparativo mensal/anual --- */
function switchComparativoModo(modo){ REL_COMPARATIVO_MODO = modo; renderRelContent(); }
function renderRelComparativo(){
  const modo = REL_COMPARATIVO_MODO;
  const buckets = [];
  if(modo==='mensal'){
    for(let i=11;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); const mk=d.toISOString().slice(0,7); buckets.push({key:mk, label:mk.split('-').reverse().join('/')}); }
  } else {
    const anoAtual = Number(todayISO().slice(0,4));
    for(let i=4;i>=0;i--){ const y=anoAtual-i; buckets.push({key:String(y), label:String(y)}); }
  }
  const matchKey = (dateISO)=> modo==='mensal' ? monthKeyOf(dateISO) : (dateISO?dateISO.slice(0,4):'');
  const docsData = buckets.map(b=> DB.atividades.filter(a=>matchKey(a.dataInicio)===b.key).length);
  const custosData = buckets.map(b=> DB.custos.filter(c=>matchKey(c.data)===b.key).reduce((s,c)=>s+custoTotal(c),0));

    </div>`;
  drawLineChart('chartCompDocs', buckets.map(b=>b.label), [{label:'Documentos', data:docsData, color:'#1A9E38'}]);

  drawLineChart('chartCompAtestados', buckets.map(b=>b.label), [{label:'Dias', data:atestadosData, color:'#A6433D'}]);
  drawLineChart('chartCompNC', buckets.map(b=>b.label), [{label:'NCs', data:ncData, color:'#3E6B8C'}]);
}
function exportarComparativoCSV(){
  const modo = REL_COMPARATIVO_MODO;
  const buckets = [];
  if(modo==='mensal'){ for(let i=11;i>=0;i--){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i); buckets.push(d.toISOString().slice(0,7)); } }
  else { const anoAtual=Number(todayISO().slice(0,4)); for(let i=4;i>=0;i--){ buckets.push(String(anoAtual-i)); } }
  const matchKey = (dateISO)=> modo==='mensal' ? monthKeyOf(dateISO) : (dateISO?dateISO.slice(0,4):'');
  const rows = buckets.map(k=>[k,
    DB.atividades.filter(a=>matchKey(a.dataInicio)===k).length,
    DB.custos.filter(c=>matchKey(c.data)===k).reduce((s,c)=>s+custoTotal(c),0),
    DB.atestados.filter(a=>matchKey(a.dataInicio)===k).reduce((s,a)=>s+a.dias,0),
    DB.naoConformidades.filter(n=>matchKey(n.dataOcorrencia)===k).length]);
  exportCSV('comparativo_'+modo+'.csv', ['Período','Documentos','Custos','Dias atestado','Não conformidades'], rows);
}

/* ---------------------- INDICADORES (Dashboard) ---------------------- */
function previousPeriodBounds(bounds){
  const iniD = new Date(bounds.ini), fimD = new Date(bounds.fim);
  const lengthDays = Math.round((fimD-iniD)/86400000)+1;
  const prevFim = new Date(iniD); prevFim.setDate(prevFim.getDate()-1);
  const prevIni = new Date(prevFim); prevIni.setDate(prevIni.getDate()-(lengthDays-1));
  return {ini: prevIni.toISOString().slice(0,10), fim: prevFim.toISOString().slice(0,10), label:'Período anterior'};
}
function kpi(label, value, sub, colorClass, alert, customIcon){
  colorClass = colorClass || 'green';
  const icons = {green:'✓', red:'✚', amber:'$', blue:'◷'};
  const icon = customIcon || icons[colorClass] || '•';
  return `<div class="kpi color-${colorClass} ${alert?'alert':''}">
    <div class="kpi-top"><div class="lbl">${esc(label)}</div><div class="icon-circle icon-${colorClass}">${icon}</div></div>
    <div class="num">${value}</div>${sub?`<div class="sub">${esc(sub)}</div>`:''}
  </div>`;
}
function variacaoHtml(atual, anterior){
  const delta = atual - anterior;
  const cls = delta>0?'pos':delta<0?'neg':'zero';
  const sinal = delta>0?'+':'';
  return `<span class="variacao ${cls}">${sinal}${delta}</span>`;
}
function sectionTitle(icon, texto){ return `<div class="section-title"><span class="sec-icon">${icon}</span>${esc(texto)}</div>`; }

function renderIndTreinamentos(){
  const el = document.getElementById('indContent');
  const bounds = periodBounds(IND_PERIODO);
  const treinosP = DB.treinamentos.filter(t=>inPeriod(t.data,bounds));
  const horas = treinosP.reduce((s,t)=>s+(Number(t.cargaHoraria)||0),0);
  const custoTreinamentos = treinosP.reduce((s,t)=>{
    const col = DB.colaboradores.find(c=>c.id===t.colaboradorId); const valorHora = col?(col.salarioAtual/220):0;
    return s + valorHora*(Number(t.cargaHoraria)||0);
  },0);
  const porColab = DB.colaboradores.map(c=>({nome:c.nome, horas:treinosP.filter(t=>t.colaboradorId===c.id).reduce((s,t)=>s+(Number(t.cargaHoraria)||0),0)})).filter(c=>c.horas>0);

  IND_EXPORT = {filename:'indicadores_treinamentos.csv', headers:['Indicador','Valor'], rows:[
    ['Período', bounds.label], ['Treinamentos realizados', treinosP.length], ['Horas de treinamento', horas.toFixed(1)], ['Custo de treinamentos', fmtMoney(custoTreinamentos)],
  ]};

  el.innerHTML = `
    <div class="grid cols-3">
      ${kpi('Treinamentos Realizados', treinosP.length, bounds.label, 'blue', false, '🎓')}
      ${kpi('Horas de Treinamento', horas.toFixed(1)+'h', '', 'blue', false, '⏱️')}
      ${kpi('Custo de Treinamentos', fmtMoney(custoTreinamentos), '', 'amber', false, '💰')}
    </div>
    <div class="card" style="margin-top:14px;"><h3>Horas por colaborador</h3>
      ${porColab.length===0?emptyState('Nenhum treinamento no período',''):'<canvas id="chartIndTreinos" height="220"></canvas>'}
    </div>
  `;
  if(porColab.length) drawBarChart('chartIndTreinos', porColab.map(c=>c.nome), porColab.map(c=>c.horas), 'Horas', '#3E6B8C');
}

/* --- Aba: Gestão de Pessoas --- */
function renderIndPessoas(){
  const el = document.getElementById('indContent');
  const bounds = periodBounds(IND_PERIODO);
  const colaboradoresAtivos = DB.colaboradores.length;
  const atestadosP = DB.atestados.filter(a=>inPeriod(a.dataInicio,bounds));
  const diasAtestado = atestadosP.reduce((s,a)=>s+a.dias,0);
  const periodDays = daysBetween(bounds.ini,bounds.fim)+1;
  const diasUteisPeriodo = Math.max(1, Math.round(periodDays*5/7));
  const absenteismo = colaboradoresAtivos>0 ? (diasAtestado/(colaboradoresAtivos*diasUteisPeriodo)*100) : 0;
  const emFeriasAgora = DB.ferias.filter(f=>f.dataInicio<=todayISO() && f.dataFim>=todayISO()).length;
  const feriasPorStatus = DB.statusFerias.map(s=>({nome:s.nome, qtd:DB.ferias.filter(f=>f.statusFeriasId===s.id).length}));
  const horasTreinamento = DB.treinamentos.filter(t=>inPeriod(t.data,bounds)).reduce((s,t)=>s+(Number(t.cargaHoraria)||0),0);
  const acidentesP = DB.acidentes.filter(a=>inPeriod(a.data,bounds));
  const acidentesComAfastamento = acidentesP.filter(a=>a.tipoAfastamento==='Com afastamento').length;
  const licencasP = DB.licencas.filter(l=>inPeriod(l.dataInicio,bounds));
  const licencasMaternidade = licencasP.filter(l=>l.tipo==='Maternidade').length;
  const licencasPaternidade = licencasP.filter(l=>l.tipo==='Paternidade').length;

  // Ranking de CID (atestados + acidentes) no período
  const cidTally = {};
  atestadosP.forEach(a=>{ if(a.cid){ cidTally[a.cid]=(cidTally[a.cid]||0)+1; } });
  acidentesP.forEach(a=>{ if(a.cid){ cidTally[a.cid]=(cidTally[a.cid]||0)+1; } });
  const cidRanking = Object.entries(cidTally).map(([codigo,qtd])=>({codigo,qtd,desc:lookupCID(codigo)})).sort((a,b)=>b.qtd-a.qtd).slice(0,6);

  IND_EXPORT = {filename:'indicadores_pessoas.csv', headers:['Indicador','Valor'], rows:[
    ['Período', bounds.label], ['Colaboradores ativos', colaboradoresAtivos], ['Dias de atestado', diasAtestado], ['Absenteísmo (%)', absenteismo.toFixed(1)],
    ['Em férias agora', emFeriasAgora], ['Horas de treinamento', horasTreinamento.toFixed(1)], ['Acidentes', acidentesP.length], ['Acidentes com afastamento', acidentesComAfastamento],
    ['Licenças maternidade', licencasMaternidade], ['Licenças paternidade', licencasPaternidade],
  ]};

  el.innerHTML = `
    <div class="grid cols-4">
      ${kpi('Colaboradores Ativos', colaboradoresAtivos, '', 'green', false, '🧑\u200d🤝\u200d🧑')}
      ${kpi('Dias de Atestado', diasAtestado, bounds.label, 'red', false, '🩺')}
      ${kpi('Absenteísmo', absenteismo.toFixed(1)+'%', 'base: '+diasUteisPeriodo+' dias úteis', 'red', false, '📉')}
      ${kpi('Horas de Treinamento', horasTreinamento.toFixed(1)+'h', bounds.label, 'blue', false, '🎓')}
    </div>
    <div class="grid cols-4" style="margin-top:14px;">
      ${kpi('Em Férias Agora', emFeriasAgora, '', 'green', false, '🌴')}
      ${feriasPorStatus.map(s=>kpi(s.nome, s.qtd, 'férias', 'green', false, '🌴')).join('')}
    </div>
    <div class="grid cols-4" style="margin-top:14px;">
      ${kpi('Acidentes de Trabalho', acidentesP.length, bounds.label, 'red', acidentesP.length>0, '⚠️')}
      ${kpi('Acidentes com Afastamento', acidentesComAfastamento, '', 'red', acidentesComAfastamento>0, '🚑')}
      ${kpi('Licenças Maternidade', licencasMaternidade, bounds.label, 'green', false, '👶')}
      ${kpi('Licenças Paternidade', licencasPaternidade, bounds.label, 'blue', false, '👨\u200d👧')}
    </div>

    ${sectionTitle('🩺','CID\'s mais registrados no período')}
    <div class="card">
      ${cidRanking.length===0?emptyState('Nenhum CID registrado no período','Atestados e acidentes com CID informado aparecerão aqui.'):
        cidRanking.map(c=>`<div class="cid-rank-item"><div><span class="cid-code">${esc(c.codigo)}</span>${esc(c.desc||'Descrição não disponível')}</div><span class="cid-count">${c.qtd}</span></div>`).join('')}
    </div>
  `;
}

/* ---------------------- LOGIN / LOGOUT ---------------------- */
function populateLoginSelect(){ document.getElementById('loginEmail').innerHTML = DB.usuarios.map(u=>`<option value="${u.email}">${esc(u.email)} — ${esc(u.nome)}</option>`).join(''); }
function doLogin(){
  const email = document.getElementById('loginEmail').value, senha = document.getElementById('loginSenha').value;
  const user = DB.usuarios.find(u=>u.email===email && u.senha===senha); const errEl = document.getElementById('loginError');
  if(!user){ errEl.textContent='E-mail ou senha inválidos.'; return; }
  errEl.textContent=''; SESSION = {userId:user.id}; saveSession();
  logAction('Acesso','Login',`${user.nome} entrou no sistema.`); enterApp();
}
function logout(){
  if(SESSION){ logAction('Acesso','Logout',`${currentUser()?.nome||''} saiu do sistema.`); }
  SESSION = null; sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('app').classList.remove('active'); document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginSenha').value='';
}
function enterApp(){
  document.getElementById('loginScreen').style.display='none'; document.getElementById('app').classList.add('active');
  const u = currentUser(); const g = currentGrupo();
  document.getElementById('whoName').textContent = u.nome;
  document.getElementById('whoRole').textContent = g && g.nivel==='gestor' ? 'Gestor/Admin' : 'Colaborador';
  ROUTE = {section: canView('indicadores') ? 'indicadores' : 'atividades'};
  const g0 = MENU.find(m=>m.items.some(it=>it.key===ROUTE.section));
  OPEN_GROUP = g0 ? g0.group : null;
  renderSidebar(); renderMain(); renderBell();
}

function applyBrandImages(){
  document.querySelectorAll('img[data-src="LOGO"]').forEach(img=>{ img.src = LOGO_DTEL; });
  document.querySelectorAll('img[data-src="SELO"]').forEach(img=>{ img.src = SELO_QUALIDADE; });
}

(function init(){
  applyBrandImages();
  loadDB(); populateLoginSelect(); loadSession();
  if(SESSION && DB.usuarios.some(u=>u.id===SESSION.userId)){ enterApp(); }
})();
</script>
