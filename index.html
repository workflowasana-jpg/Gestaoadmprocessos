<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle Administrativo | DTEL</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --paper:#F3F6F3; --surface:#FFFFFF; --ink:#16231C; --muted:#5A6B61; --line:#D7DFD9;
  --green:#1D5A3F; --green-ink:#FFFFFF; --green-soft:#E3EFE8;
  --gold:#A9822A; --gold-soft:#F4ECD6;
  --red:#A5302B; --red-soft:#F8E2E0;
  --c-maternidade:#9A4A77; --c-paternidade:#3B679C; --c-eleitoral:#6A58A6; --c-doenca:#A8741A; --c-acidente:#A5302B;
  --radius:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101814; --surface:#18221D; --ink:#E4EBE6; --muted:#97A89E; --line:#2A3830;
    --green:#4FA47B; --green-ink:#0D1A13; --green-soft:#1E3328;
    --gold:#D5AF55; --gold-soft:#332B17; --red:#E07A72; --red-soft:#3A1F1D;
    --c-maternidade:#D88AB5; --c-paternidade:#82AEE3; --c-eleitoral:#AC9BEA; --c-doenca:#E0AE55; --c-acidente:#E07A72;
  }
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}

/* Menu lateral */
.side{position:fixed;inset:0 auto 0 0;width:236px;background:#1D5A3F;color:#FFFFFF;display:flex;flex-direction:column;
  padding:calc(22px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));z-index:5}
.brand{padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:14px}
.brand img{height:42px;width:auto;display:block;margin-bottom:10px}
.brand p{margin:0;font-weight:700;font-size:15px;line-height:1.25}
.brand span{display:block;font-weight:500;font-size:12px;opacity:.75}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:12px;background:none;border:0;border-radius:8px;padding:10px 12px;color:inherit;
  opacity:.82;cursor:pointer;font-weight:600;text-align:left;position:relative;white-space:nowrap}
nav button svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{opacity:1;background:rgba(255,255,255,.07)}
nav button[aria-current="page"]{opacity:1;background:rgba(255,255,255,.13)}
nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:#E8B92F}
nav button[aria-current="page"] svg{stroke:#F2C94C}
.side-foot{margin-top:auto;display:grid;justify-items:center;gap:12px;padding-top:16px}
.selo{height:110px;width:auto;display:block}
.who{font-size:12px;text-align:center;opacity:.85;display:grid;gap:4px;word-break:break-all}
.link{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
.shell{margin-left:236px;min-height:100vh}
main{max-width:1200px;margin:0 auto;padding:32px 28px 60px}
@media (max-width:820px){
  .side{position:sticky;top:0;inset:auto;width:auto;flex-direction:row;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
  .brand{border:0;margin:0;padding:0}
  .brand img{height:30px;margin:0}
  .brand p{display:none}
  nav{flex-direction:row;overflow-x:auto;flex:1}
  nav button{padding:8px 10px;gap:6px;font-size:14px}
  nav button[aria-current="page"]::before{display:none}
}
@media (max-width:560px){
  nav button:not([aria-current="page"]) span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .side-foot{margin:0;padding:0;display:flex}
  .selo{display:none}
  .shell{margin-left:0}
  main{padding:22px 16px 60px}
}
h2{font-size:24px;letter-spacing:-.015em;margin:0 0 4px}
h3{font-size:15px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 20px}

/* Painel */
.fora{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.fora-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.fora-head strong{font-size:40px;line-height:1;font-weight:800;color:var(--gold)}
.fora-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pessoa{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.pessoa b{font-weight:600}
.pessoa small{color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.bar-row{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.bar{height:10px;background:var(--green-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-weight:700}
.mini{list-style:none;margin:0;padding:0}
.mini li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mini li:last-child{border-bottom:0}
.alerta{background:var(--red-soft);color:var(--red);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:12px}
.vazio{color:var(--muted);font-size:14px;margin:0}

/* Módulos */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.toolbar .busca{flex:1 1 220px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--green);color:var(--green-ink);border-color:var(--green)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.del{color:var(--red)}
.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--green-soft)}
td small{display:block;color:var(--muted)}
.num{text-align:right;white-space:nowrap}
.nw{white-space:nowrap}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:14px;padding:10px 2px}
.foot b{color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,var(--muted))}
.t-maternidade{--dot:var(--c-maternidade)} .t-paternidade{--dot:var(--c-paternidade)} .t-eleitoral{--dot:var(--c-eleitoral)}
.t-doenca{--dot:var(--c-doenca)} .t-acidente{--dot:var(--c-acidente)}
.s{font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap;background:var(--green-soft);color:var(--green)}
.s.warn{background:var(--gold-soft);color:var(--gold)}
.s.off{background:transparent;color:var(--muted);border:1px solid var(--line)}
.s.bad{background:var(--red-soft);color:var(--red)}
.empty-row td{text-align:center;color:var(--muted);padding:32px;cursor:default}

/* Formulário */
dialog{border:0;border-radius:14px;padding:0;width:min(640px,calc(100% - 24px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,20,15,.45)}
.dlg-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dlg-head h3{margin:0;font-size:18px}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
.fields{padding:18px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px;max-height:65vh;overflow:auto}
.f{display:grid;gap:4px;font-size:14px}
.f.full{grid-column:1/-1}
.f label{font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 10px;width:100%}
.f textarea{min-height:70px;resize:vertical}
.aviso{color:var(--red);font-size:13px}
.f input[readonly]{background:transparent;color:var(--muted)}
.f.chk{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-weight:500}
.f.chk input{width:18px;height:18px;accent-color:var(--green)}
.hint{color:var(--gold);font-size:13px}
.dlg-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px}
@media (max-width:560px){.fields{grid-template-columns:1fr}.bar-row{grid-template-columns:100px 1fr auto}}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;width:min(400px,100%);display:grid;gap:14px;padding:28px 28px 0}
.login-selo{display:flex;justify-content:center;margin-bottom:4px}
.login-selo img{height:150px;width:auto;display:block}
.login h1,.login p{text-align:center}
.login-foot{margin:10px -28px 0;background:#1D5A3F;padding:12px 20px;display:flex;justify-content:flex-end}
.login-foot img{height:32px;width:auto;display:block}
.login h1{margin:0;font-size:22px}
.login p{margin:0;color:var(--muted);font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-size:14px;z-index:99;max-width:calc(100% - 32px)}
.toast.err{background:var(--red);color:#fff}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:pop .16s ease-out}@keyframes pop{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>

<script>
/* =========================================================
   CONFIGURAÇÃO — cole aqui os dados do seu projeto Supabase
   (Project Settings > API). Deixe vazio para usar o modo local,
   que guarda tudo só neste navegador.
   ========================================================= */
const SUPABASE_URL = "";
const SUPABASE_ANON_KEY = "";

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseD = s => { if (!s) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmtD = s => s ? s.slice(0,10).split("-").reverse().join("/") : "—";
const contaDias = (a,b) => { const x = parseD(a), y = parseD(b); return x && y ? Math.round((y - x) / 864e5) + 1 : 0; };
const addDias = (s,n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
const addMeses = (s,n) => { const d = parseD(s); d.setMonth(d.getMonth() + n); return iso(d); };
const brl = v => Number(v || 0).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
const soma = (rows,k) => rows.reduce((t,r) => t + Number(r[k] || 0), 0);
const HOJE = iso(new Date());
const situacao = r => HOJE < r.data_inicio ? "futuro" : HOJE > r.data_fim ? "encerrado" : "em_curso";

function toast(msg, erro=false){
  const t = document.createElement("div");
  t.className = "toast" + (erro ? " err" : ""); t.textContent = msg; t.setAttribute("role","status");
  document.body.appendChild(t); setTimeout(() => t.remove(), erro ? 6000 : 2600);
}

/* ---------- dicionários ---------- */
const TIPOS = { maternidade:"Licença maternidade", paternidade:"Licença paternidade", eleitoral:"Eleitoral", doenca:"Doença", acidente:"Acidente" };
const SUGESTAO = {
  maternidade:[120,"Sugestão: 120 dias (180 se a empresa for Empresa Cidadã)."],
  paternidade:[5,"Sugestão: 5 dias (20 se a empresa for Empresa Cidadã)."],
  eleitoral:[2,"Eleitoral: 2 dias de folga para cada dia de serviço à Justiça Eleitoral."],
  acidente:[0,"Acima de 15 dias o afastamento passa a ser pago pelo INSS. Lembre de emitir a CAT."],
  doenca:[0,"Acima de 15 dias o colaborador deve ser encaminhado ao INSS."]
};
const CATS = { inventario:"Inventário", projeto:"Projetos", auditoria:"Auditoria externa" };
const ST_CUSTO = { previsto:"Previsto", aprovado:"Aprovado", pago:"Pago" };
const ST_FER = { programada:"Programada", aprovada:"Aprovada", em_gozo:"Em gozo", concluida:"Concluída" };

function sitTag(r){
  const s = situacao(r);
  return s === "em_curso" ? `<span class="s">Em curso</span>` : s === "futuro" ? `<span class="s warn">Agendado</span>` : `<span class="s off">Encerrado</span>`;
}
const prazoConcessivo = r => r.aquisitivo_fim ? addMeses(r.aquisitivo_fim, 12) : null;
function feriasEmRisco(r){
  const p = prazoConcessivo(r);
  if (!p || r.status === "concluida") return false;
  return r.data_fim > p || (r.status === "programada" && p <= addDias(HOJE, 60));
}

function tempoCasa(d){
  if (!d) return "";
  const a = parseD(d), h = parseD(HOJE);
  let m = (h.getFullYear() - a.getFullYear()) * 12 + h.getMonth() - a.getMonth();
  if (h.getDate() < a.getDate()) m--;
  if (m < 0) return "";
  const anos = Math.floor(m / 12), meses = m % 12;
  return [anos ? anos + (anos > 1 ? " anos" : " ano") : "", meses ? meses + (meses > 1 ? " meses" : " mês") : ""].filter(Boolean).join(" e ") || "menos de 1 mês";
}

/* ---------- armazenamento (Supabase ou local) ---------- */
const sb = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const lsGet = t => { try { return JSON.parse(localStorage.getItem("ca_" + t) || "[]"); } catch { return []; } };
const lsSet = (t,v) => { try { localStorage.setItem("ca_" + t, JSON.stringify(v)); } catch { toast("Não foi possível salvar no navegador.", true); } };

const PREFIXO = "sgi_"; // prefixo das tabelas no Supabase
const tb = t => PREFIXO + t;
const store = {
  async list(t){
    if (!sb) return lsGet(t);
    const { data, error } = await sb.from(tb(t)).select("*").order("created_at", { ascending:false });
    if (error) throw error; return data;
  },
  async save(t,row){
    const { id, created_at, ...r } = row;
    if (!sb){
      const all = lsGet(t);
      if (id){ const i = all.findIndex(x => x.id === id); all[i] = { ...all[i], ...r }; }
      else all.unshift({ ...r, id: crypto.randomUUID(), created_at: new Date().toISOString() });
      return lsSet(t, all);
    }
    const { error } = id ? await sb.from(tb(t)).update(r).eq("id", id) : await sb.from(tb(t)).insert(r);
    if (error) throw error;
  },
  async remove(t,id){
    if (!sb) return lsSet(t, lsGet(t).filter(x => x.id !== id));
    const { error } = await sb.from(tb(t)).delete().eq("id", id);
    if (error) throw error;
  }
};

/* ---------- estado ---------- */
const data = { colaboradores:[], atestados:[], custos:[], ferias:[] };
const filtros = { colaboradores:{}, atestados:{}, custos:{}, ferias:{} };
let view = "painel";
let editando = null; // { mod, row }

let falhas = {};
async function carregar(){
  const tabelas = ["colaboradores","atestados","custos","ferias"];
  const res = await Promise.allSettled(tabelas.map(t => store.list(t)));
  falhas = {};
  res.forEach((r,i) => {
    if (r.status === "fulfilled") data[tabelas[i]] = r.value || [];
    else { falhas[tabelas[i]] = r.reason?.message || String(r.reason); console.error("Falha ao ler", tb(tabelas[i]), r.reason); }
  });
  const nomes = Object.keys(falhas);
  if (nomes.length) toast(`Não foi possível ler: ${nomes.map(tb).join(", ")}. ${Object.values(falhas)[0]}`, true);
  render();
}

// explica por que a lista de colaboradores está vazia
function motivoSemColaboradores(){
  if (!sb) return "O sistema não está conectado ao Supabase. Preencha SUPABASE_URL e SUPABASE_ANON_KEY no topo do index.html e publique de novo.";
  if (falhas.colaboradores) return `Erro ao ler a tabela ${tb("colaboradores")}: ${falhas.colaboradores}. Rode o schema.sql no Supabase.`;
  if (!data.colaboradores.length) return `A tabela ${tb("colaboradores")} está vazia. Rode o colaboradores_carga.sql no Supabase ou cadastre em Colaboradores.`;
  if (!ativos().length) return "Nenhum colaborador está marcado como ativo.";
  return "";
}

function barras(obj, total, fmt){
  const max = Math.max(...Object.values(obj), 1);
  return Object.entries(obj).map(([k,v]) =>
    `<div class="bar-row"><span>${k}</span><div class="bar"><i style="width:${(v/max*100).toFixed(1)}%"></i></div><span class="num">${fmt(v)}</span></div>`
  ).join("") + `<div class="total"><span>Total</span><span>${fmt(total)}</span></div>`;
}

function renderPainel(){
  const mes = HOJE.slice(0,7), ano = HOJE.slice(0,4);
  const nomeMes = new Date().toLocaleDateString("pt-BR", { month:"long" });
  const fora = [
    ...data.atestados.filter(r => situacao(r) === "em_curso").map(r => ({ ...r, motivo: TIPOS[r.tipo], cls:"t-" + r.tipo })),
    ...data.ferias.filter(r => situacao(r) === "em_curso").map(r => ({ ...r, motivo:"Férias", cls:"" }))
  ].sort((a,b) => a.data_fim.localeCompare(b.data_fim));

  // conta só os dias que caem dentro do mês atual (inclui afastamentos que começaram antes)
  const mIni = mes + "-01", mFim = addDias(addMeses(mIni, 1), -1);
  const diasPorTipo = {}; Object.values(TIPOS).forEach(t => diasPorTipo[t] = 0);
  let totalMes = 0;
  data.atestados.forEach(r => {
    const a = r.data_inicio > mIni ? r.data_inicio : mIni, b = r.data_fim < mFim ? r.data_fim : mFim;
    if (a <= b){ const d = contaDias(a, b); diasPorTipo[TIPOS[r.tipo]] += d; totalMes += d; }
  });

  const custAno = data.custos.filter(r => (r.data || "").startsWith(ano));
  const porCat = {}; Object.values(CATS).forEach(c => porCat[c] = 0);
  custAno.forEach(r => porCat[CATS[r.categoria]] += Number(r.valor || 0));

  const prox = data.ferias.filter(r => r.data_inicio > HOJE && r.data_inicio <= addDias(HOJE,30)).sort((a,b) => a.data_inicio.localeCompare(b.data_inicio));
  const risco = data.ferias.filter(feriasEmRisco);
  const docPend = data.atestados.filter(r => !r.documento_entregue);

  $("#main").innerHTML = `
    <section class="fora" aria-labelledby="foraT">
      <div class="fora-head"><strong>${fora.length}</strong><h3 id="foraT" style="margin:0">${fora.length === 1 ? "pessoa fora hoje" : "pessoas fora hoje"}</h3>${ativos().length ? `<span style="color:var(--muted);font-size:14px">${ativos().length} colaboradores ativos no time</span>` : ""}</div>
      ${fora.length ? `<div class="fora-list">${fora.map(r => `
        <div class="pessoa"><b>${esc(r.colaborador)}</b><span class="tag ${r.cls}">${esc(r.motivo)}</span><small>Retorna em ${fmtD(addDias(r.data_fim,1))}</small></div>`).join("")}</div>`
      : `<p class="vazio">Todo mundo trabalhando hoje.</p>`}
    </section>
    <div class="grid3">
      <section class="box"><h3>Dias de afastamento em ${nomeMes}</h3>${barras(diasPorTipo, totalMes, v => v + " d")}
        ${docPend.length ? `<div class="alerta">${docPend.length} atestado(s) sem documento original entregue.</div>` : ""}</section>
      <section class="box"><h3>Custos em ${ano}</h3>${barras(porCat, soma(custAno,"valor"), brl)}</section>
      <section class="box"><h3>Férias nos próximos 30 dias</h3>
        ${prox.length ? `<ul class="mini">${prox.map(r => `<li><span>${esc(r.colaborador)}</span><span>${fmtD(r.data_inicio)}, ${r.dias} d</span></li>`).join("")}</ul>` : `<p class="vazio">Nenhuma saída programada.</p>`}
        ${risco.length ? `<div class="alerta">${risco.length} férias com prazo concessivo vencendo ou ultrapassado (risco de pagamento em dobro).</div>` : ""}

function filtrar(nome){
  const m = MOD[nome], f = filtros[nome], q = (f.q || "").toLowerCase();
  const val = r => m.filtro.get ? m.filtro.get(r) : r[m.filtro.k];
  const rows = data[nome].filter(r =>
    (!q || m.busca.some(k => String(r[k] || "").toLowerCase().includes(q))) &&
    (!f.cat || val(r) === f.cat) &&
    (!f.cat2 || r[m.filtro2.k] === f.cat2) &&
    (!f.mes || String(r[m.dataKey] || "").startsWith(f.mes))
  );
  return m.ordem ? rows.sort(m.ordem) : rows;
}

function desenharLinhas(nome){
  const m = MOD[nome], rows = filtrar(nome);
  $("#tbody").innerHTML = rows.length
    ? rows.map(r => `<tr data-id="${esc(r.id)}" tabindex="0">${m.cols.map(c => `<td class="${c[2] || ""}">${c[1](r)}</td>`).join("")}</tr>`).join("")
    : `<tr class="empty-row"><td colspan="${m.cols.length}">${data[nome].length ? "Nenhum registro com esses filtros." : (nome === "colaboradores" ? esc(motivoSemColaboradores()) : `Nenhum ${m.nome} cadastrado. Use “Novo ${m.nome}” para começar.`)}</td></tr>`;
  $("#foot").innerHTML = m.rodape(rows);
  $("#tbody").querySelectorAll("tr[data-id]").forEach(tr => {
    const abrir = () => abrirForm(nome, data[nome].find(r => String(r.id) === tr.dataset.id));
    tr.onclick = abrir; tr.onkeydown = e => { if (e.key === "Enter") abrir(); };
  });
}

/* ---------- formulário ---------- */
function abrirForm(nome, row){
  const m = MOD[nome]; row = row || {};
  editando = { nome, row };
  $("#dlgTitle").textContent = (row.id ? "Editar " : "Novo ") + m.nome;
  $("#dlgDel").hidden = !row.id;
  $("#fields").innerHTML = m.fields.map(fd => {
    const v = row[fd.k] ?? (fd.k === "status" ? Object.keys(fd.opts)[0] : "");
    const id = "fd_" + fd.k, req = fd.req ? "required" : "";
    if (fd.type === "hint") return `<p class="hint f full" id="hint" aria-live="polite"></p>`;
    if (fd.type === "check") return `<label class="f chk"><input type="checkbox" name="${fd.k}" ${(row.id ? row[fd.k] : fd.def) ? "checked" : ""}> ${fd.label}</label>`;
    let input;
    if (fd.type === "colab"){
      const lista = ativos();
      const extra = v && !lista.some(c => c.nome === v) ? `<option value="${esc(v)}" selected>${esc(v)} (fora do cadastro)</option>` : "";
      input = lista.length || extra
        ? `<select id="${id}" name="${fd.k}" ${req}><option value="">Selecione</option>${extra}${lista.map(c => `<option value="${esc(c.nome)}" data-mat="${esc(c.matricula || "")}" ${v === c.nome ? "selected" : ""}>${esc(c.nome)}</option>`).join("")}</select>`
        : `<select id="${id}" name="${fd.k}" required><option value="">Nenhum colaborador disponível</option></select><span class="aviso">${esc(motivoSemColaboradores())}</span>`;
    }
    else if (fd.type === "select") input = `<select id="${id}" name="${fd.k}" ${req}>${fd.req ? "" : '<option value=""></option>'}${Object.entries(fd.opts).map(([k,l]) => `<option value="${k}" ${v === k ? "selected" : ""}>${l}</option>`).join("")}</select>`;
    else if (fd.type === "area") input = `<textarea id="${id}" name="${fd.k}">${esc(v)}</textarea>`;
    else input = `<input id="${id}" name="${fd.k}" type="${fd.type || "text"}" ${fd.type === "number" ? 'step="0.01" min="0"' : ""} value="${esc(v)}" ${req} ${fd.ro ? 'readonly tabindex="-1" placeholder="Preenchida pelo cadastro"' : ""} ${fd.mask === "cpf" ? 'inputmode="numeric" maxlength="14"' : ""}>`;
    return `<div class="f ${fd.full || fd.type === "area" ? "full" : ""}"><label for="${id}">${fd.label}</label>${input}</div>`;
  }).join("");

  // dicas e preenchimento automático
  const form = $("#form");
  if (form.elements.colaborador && form.elements.colaborador.tagName === "SELECT")
    form.elements.colaborador.onchange = e => { const o = e.target.selectedOptions[0]; if (form.elements.matricula) form.elements.matricula.value = o?.dataset.mat || ""; };
  if (nome === "colaboradores") form.elements.cpf.oninput = e => { e.target.value = fmtCPF(e.target.value); };
  const atualizarDica = () => {
    const h = $("#hint"); if (!h) return;
    if (nome === "atestados"){
      const tipo = form.tipo.value, s = SUGESTAO[tipo];
      if (s && s[0] && form.data_inicio.value && !form.data_fim.value) form.data_fim.value = addDias(form.data_inicio.value, s[0] - 1);
      const d = contaDias(form.data_inicio.value, form.data_fim.value);
      h.textContent = [d ? `${d} dia(s).` : "", s ? s[1] : ""].join(" ").trim();
    } else if (nome === "ferias"){
      if (form.aquisitivo_inicio.value && !form.aquisitivo_fim.value) form.aquisitivo_fim.value = addDias(addMeses(form.aquisitivo_inicio.value, 12), -1);
      const d = contaDias(form.data_inicio.value, form.data_fim.value);
      const p = form.aquisitivo_fim.value ? addMeses(form.aquisitivo_fim.value, 12) : null;
      h.textContent = [d ? `${d} dia(s) de férias.` : "", p ? `Precisa terminar até ${fmtD(p)} (prazo concessivo).` : ""].join(" ").trim();
    }
  };
  form.oninput = atualizarDica; atualizarDica();
  $("#dlg").showModal();
}

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const { nome, row } = editando, m = MOD[nome], form = e.target;
  const r = { ...row };
  m.fields.forEach(fd => {
    if (fd.type === "hint") return;
    const el = form.elements[fd.k];
    if (fd.type === "check") r[fd.k] = el.checked;
    else if (fd.type === "number") r[fd.k] = el.value === "" ? null : parseFloat(el.value);
    else r[fd.k] = el.value.trim() === "" ? null : el.value.trim();
  });
  m.calc && m.calc(r);
  const erro = m.valida && m.valida(r);
  if (erro) return toast(erro, true);
  try {
    await store.save(nome, r);
    $("#dlg").close(); toast(row.id ? "Alterações salvas." : "Registro salvo.");
    await carregar();
  } catch (err) { toast("Não foi possível salvar: " + (err.message || err), true); }
});

$("#dlgDel").onclick = async () => {
  const { nome, row } = editando;
  const msg = nome === "colaboradores"
    ? `Excluir ${row.nome} do cadastro? Os atestados e férias dele continuam salvos. Se a pessoa saiu da empresa, prefira desmarcar "Colaborador ativo".`
    : `Excluir este registro de ${row.colaborador || row.descricao}? Essa ação não pode ser desfeita.`;
  if (!confirm(msg)) return;
  try { await store.remove(nome, row.id); $("#dlg").close(); toast("Registro excluído."); await carregar(); }
  catch (err) { toast("Não foi possível excluir: " + (err.message || err), true); }
};
$("#dlgClose").onclick = $("#dlgCancel").onclick = () => $("#dlg").close();

/* ---------- exportação (abre no Excel) ---------- */
function exportarCSV(nome){
  const m = MOD[nome], rows = filtrar(nome);
  const campos = m.fields.filter(f => f.type !== "hint");
  const extra = ["atestados","ferias"].includes(nome) ? [{ k:"dias", label:"Dias" }] : [];
  const cols = [...campos, ...extra];
  const val = (f, r) => {
    let v = r[f.k];
    if (f.type === "select") v = f.opts[v] || v;
    else if (f.type === "date") v = fmtD(v);
    else if (f.type === "check") v = v ? "Sim" : "Não";
    else if (f.type === "number") v = v == null ? "" : String(v).replace(".", ",");
    return `"${String(v ?? "").replace(/"/g,'""')}"`;
  };
  const linhas = [cols.map(c => `"${c.label}"`).join(";"), ...rows.map(r => cols.map(c => val(c, r)).join(";"))];
  const blob = new Blob(["\ufeff" + linhas.join("\r\n")], { type:"text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `${nome}_${HOJE}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- navegação e login ---------- */
$("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b){ view = b.dataset.view; render(); } });

async function iniciar(){
  if (!sb){
    $("#app").hidden = false; return carregar();
  }
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ $("#login").hidden = false; $("#app").hidden = true; return; }
  $("#modo").textContent = session.user.email;
  $("#sair").hidden = false; $("#login").hidden = true; $("#app").hidden = false;
  carregar();
}

$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: $("#lgEmail").value, password: $("#lgSenha").value });
  if (error) return toast("E-mail ou senha incorretos.", true);
  iniciar();
});
$("#sair").onclick = async () => { await sb.auth.signOut(); location.reload(); };

iniciar();
</script>
